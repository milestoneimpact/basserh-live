<!doctype html>
<!-- The studio: an organisation builds its events here (cues, people, files, identity), rehearses, publishes and hands out the links of the screens.
     One page; the data is the event document (engine/config.js), saved as a draft after every change. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بصيرة · استوديو اللقاءات</title>
<link rel="icon" href="brand/icon.png"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="fonts/brand.css">
<style>
header{background:linear-gradient(120deg,var(--deep),var(--night));color:var(--cream);padding:16px 34px;display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--gold)}
header h1{font:900 22px Kufi}header .org{font:400 14px Plex;color:var(--gold2)}header .sp{flex:1}header a{color:var(--gold2);font:600 14px Plex;text-decoration:none}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ev{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;transition:.2s}.ev:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 18px 40px rgba(14,17,20,.09)}
.ev h3{font:700 21px Kufi;color:var(--deep)}.ev p{margin:6px 0 0;color:var(--mute);font-size:14px}

.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}
.tabs{display:flex;gap:6px;margin:6px 0 20px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:12px 20px;font:700 16px Kufi;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--deep);border-color:var(--gold)}.tabs .n{font:600 12px Plex;background:var(--bad);color:#fff;border-radius:999px;padding:0 7px;margin-inline-start:6px}
.split{display:grid;grid-template-columns:400px 1fr;gap:20px;align-items:start}
.cue{display:grid;grid-template-columns:20px 30px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;background:#fff;cursor:pointer}
.cue.on{border-color:var(--gold);background:#FBF6EA}.cue.off{opacity:.45}.cue .h{cursor:grab;color:#B5AC98}.cue .p{font:600 19px Corm;color:var(--gold);text-align:center}

.file{display:grid;grid-template-columns:54px 1fr auto auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}

.drop{border:2px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--mute);margin-bottom:16px}.drop.hot{border-color:var(--gold);background:#FBF6EA}
.prob{padding:10px 14px;border-radius:10px;background:#FBEDEA;color:var(--bad);margin-bottom:6px;font-weight:600}.okb{padding:12px 16px;border-radius:10px;background:#F1EAD8;color:var(--deep);font-weight:600;border:1px solid var(--line)}

#gate{max-width:520px;margin:120px auto;text-align:center}
/* the moment on show: the cue being edited, drawn by the very page that draws it in the hall */
#pv{margin:-24px -24px 18px;background:#0E1114;border-radius:18px 18px 0 0;padding:14px 14px 10px}#pv .scr{position:relative;margin:0 auto;aspect-ratio:16/9;max-height:340px;border-radius:10px;overflow:hidden;background:#000}#pv.tall .scr{aspect-ratio:9/16;max-height:420px}#pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pv .bar{display:flex;gap:8px;align-items:center;margin-top:10px;color:#A9B2B4;font-size:13px}#pv .bar span{flex:1}#pv .bar button{border:1px solid rgba(228,204,151,.3);background:#1F2A2E;color:#E8D9BD;border-radius:9px;padding:5px 13px;cursor:pointer;font:600 13px Plex}#pv .bar button:hover{border-color:var(--gold)}#pv .bar button.on{background:var(--gold);color:#0E1114}
.panel{box-shadow:0 1px 0 rgba(14,17,20,.03),0 14px 34px rgba(14,17,20,.045)}.ev{box-shadow:0 10px 28px rgba(14,17,20,.05)}

.tabs button{border-radius:10px 10px 0 0;transition:.15s}.tabs button:hover{color:var(--deep);background:#FBF6EA}
@media(max-width:900px){.split{grid-template-columns:1fr!important}header .wm span,header>span[style*="margin-inline-start:6px"]{display:none}header .sp{display:none}header .org{flex:1}header{flex-wrap:wrap;padding:12px 16px;gap:10px}main{padding:18px 14px 60px}.hero{flex-direction:column;align-items:stretch}#evName{width:100%!important;font-size:24px!important}.tabs{overflow-x:auto}.tabs button{padding:10px 14px;white-space:nowrap}.types{grid-template-columns:repeat(2,1fr)}.grid2,.tpls{grid-template-columns:1fr}.row{grid-template-columns:1fr!important}.link{grid-template-columns:1fr auto}.stp{min-width:46%}}

/* the light dress: paper and white, charcoal ink, gold for what matters */
header{background:#fff;color:var(--deep);border-bottom:1px solid var(--line);box-shadow:0 2px 16px rgba(14,17,20,.05)}.wm{color:var(--deep)}.wm:before{background-image:url(brand/mark.png)}.wm span{color:#8E6626}
header .org{color:#8E6626}header a{color:#8E6626}header a:hover{color:var(--deep)}#saved{color:var(--mute)!important}header>span[style*="gold2"]{color:#8E6626!important}
#pv{background:#F1EAD8;border-bottom:1px solid var(--line)}#pv .scr{box-shadow:0 10px 26px rgba(14,17,20,.2)}#pv .bar{color:var(--mute)}#pv .bar button{border:1px solid var(--line);background:#fff;color:var(--deep)}#pv .bar button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.pwf{position:relative}.pwf input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 78px 12px 14px;text-align:center;font:600 17px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#0E1114;background:#fff;caret-color:#0E1114;outline:none;letter-spacing:.04em}.pwf input::placeholder{font:400 15px Plex;letter-spacing:0;color:#9AA0A3}.pwf input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,138,61,.2)}
.eye{display:grid;place-items:center;user-select:none;position:absolute;inset:6px 6px 6px auto;border:0;border-radius:8px;background:#F1EAD8;color:#7A5A1E;font:600 13px Plex;padding:0 12px;cursor:pointer}.pwh{min-height:1.5em;font-size:13.5px;color:var(--bad);margin-top:6px;text-align:center}
</style></head><body>
<header><div class="wm">بصيرة<i></i><span>BASSERH</span></div><span style="font:600 14px Plex;color:var(--gold2);margin-inline-start:6px">استوديو اللقاءات</span><span class="org" id="orgName"></span><span class="sp"></span><span id="saved" style="font-size:13px;color:var(--gold2)"></span><a href="#" id="pwSet" style="color:var(--gold2);font:600 13px Plex;text-decoration:none;margin-inline-end:14px;display:none">كلمة المرور</a><a href="#" id="pk" title="الدخول لاحقاً ببصمة هذا الجهاز أو رمزه، بلا رابط دعوة">إضافة مفتاح مرور</a><a href="#" id="home">لقاءاتي</a><a href="/api/logout">خروج</a></header>
<main id="app"></main><div id="toast"></div><script src="vendor/qrcode.js"></script>
<script type="module">

import * as SFX from './run/sfx.js';
const $ = (s, r = document) => r.querySelector(s), app = $('#app'), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// each organisation works under its own address (/<slug>); the slug goes with every request

const api = async (path, opt = {}) => { const r = await fetch(path, { ...opt, headers: { ...ORG, ...(opt.body && typeof opt.body === 'string' ? { 'Content-Type': 'application/json' } : {}), ...(opt.headers || {}) } }); const j = await r.json().catch(() => ({})); if (r.status === 401 && ME && ME.user && path !== '/api/login') { toast('انتهت جلستك. ادخل من جديد.'); setTimeout(() => location.reload(), 1200); throw new Error('session'); } if (!r.ok && !opt.soft) { toast(j.error || 'تعذّر الطلب'); throw Object.assign(new Error(j.error), { data: j }); } return j; };
// the password field: «show» lets the person see what was typed; Arabic letters mean the keyboard is in Arabic, and the page says so at once

let hearAC = null, pvTall = false, logoFor = 'before';
// the strongest colours of a picture (a logo): drawn small, its saturated pixels gathered by hue, the two largest families returned
async function logoColors(url) { try { const im = new Image(); await new Promise((ok, no) => { im.onload = ok; im.onerror = no; im.src = url; }); const W = 96, H = Math.max(1, Math.round(W * (im.naturalHeight || 1) / (im.naturalWidth || 1))), cv = Object.assign(document.createElement('canvas'), { width: W, height: H }), g = cv.getContext('2d'); g.drawImage(im, 0, 0, W, H); const d = g.getImageData(0, 0, W, H).data, B = {};
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 200) continue; const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255, mx = Math.max(r, gg, b), mn = Math.min(r, gg, b), l = (mx + mn) / 2, dl = mx - mn, sat = dl ? dl / (1 - Math.abs(2 * l - 1)) : 0; if (sat < .3 || l < .12 || l > .8) continue; let h = mx === r ? ((gg - b) / dl) % 6 : mx === gg ? (b - r) / dl + 2 : (r - gg) / dl + 4; h = Math.round(((h * 60 + 360) % 360) / 24); const k = B[h] || (B[h] = { n: 0, r: 0, g: 0, b: 0 }); k.n++; k.r += d[i]; k.g += d[i + 1]; k.b += d[i + 2]; }
    const top = Object.values(B).sort((a, b) => b.n - a.n).filter((k, i, a) => k.n > a[0].n * .12).slice(0, 2); return top.map(k => '#' + [k.r, k.g, k.b].map(v => Math.round(v / k.n).toString(16).padStart(2, '0')).join('')); } catch { return []; } }
// the preview of one cue: the stage page in «solo», after the saves on their way have landed
function pv(id) { clearTimeout(st0); st0 = setTimeout(() => { line = line.then(() => { const f = document.querySelector('#pv iframe'); if (f && E) f.src = `/run/stage.html?e=${E.id}&solo=${id}&v=${Date.now()}`; }); }, 620); } let st0;
let ME, E = null, doc = null, base = '', tab = 'cues', sel = null, probs = [];
const FIELD = { person: 'المتحدث', media: 'الملف', text: 'النص على الشاشة', url: 'الرابط' };
const KIND = { video: 'فيديو', image: 'صورة', slides: 'شرائح' };

// ---------- saving: the draft is stored a moment after every change
// ---------- a dialog of the studio: a question, a field, or a body of its own. Resolves to the answer, or null when dismissed
function ask({ title, text = '', input = null, ok = 'موافق', no = 'إلغاء', danger = false, body = '', wide = false, onOpen = null, value = null }) { return new Promise(res => { document.querySelector('#dlg')?.remove();
  const d = document.createElement('div'); d.id = 'dlg'; d.innerHTML = `<div class="dl${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${body}${input ? `<input type="${input.type || 'text'}" id="dlgIn" placeholder="${esc(input.placeholder || '')}" value="${esc(input.value || '')}" ${input.ltr ? 'dir="ltr"' : ''}>` : ''}<div class="da"><button class="btn ${danger ? 'red' : 'gold'}" id="dlgOk">${esc(ok)}</button>${no ? `<button class="btn" id="dlgNo">${esc(no)}</button>` : ''}</div></div>`;
  document.body.appendChild(d); const done = v => { removeEventListener('keydown', key, true); d.remove(); res(v); }, yes = () => { const v = value ? value(d) : input ? $('#dlgIn').value.trim() : true; if (v === '' || v === undefined) return $('#dlgIn')?.focus(); done(v); };

const hist = () => { const u = $('#undo'), r = $('#redo'); if (u) u.disabled = !undoS.length; if (r) r.disabled = !redoS.length; };
function travel(from, to) { if (!from.length) return; to.push(snap); snap = from.pop(); snapAt = 0; doc = JSON.parse(snap); if (!doc.cues.some(c => c.id === sel)) sel = doc.cues[0]?.id; save(true); draw(); }
addEventListener('keydown', e => { if (!E || !(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; e.preventDefault(); e.shiftKey ? travel(redoS, undoS) : travel(undoS, redoS); });

  // a colleague saved the same event meanwhile: nothing is overwritten without a choice
  if (r.conflict) { $('#saved').textContent = 'لم يُحفظ'; const mine = await ask({ title: 'عدّل زميل هذا اللقاء أثناء عملك', text: 'حُفظت نسخة أحدث من نسختك. اختر ما يبقى.', ok: 'اعتماد تعديلاتي', no: 'تحميل نسخة الزميل' }); if (!mine) return open(E.id, tab);
    r = await api('/api/events/' + E.id, { method: 'PUT', body: JSON.stringify(doc), headers: { 'x-force': '1' } }); }
  if (r.error) { $('#saved').textContent = 'لم يُحفظ'; return toast(r.error); } E.rev = r.rev; probs = r.problems; dirty = false; $('#saved').textContent = 'حُفظ'; steps(); const n = $('.tabs .n'); if (n) { n.textContent = probs.length; n.style.display = probs.length ? '' : 'none'; } }).catch(() => { $('#saved').textContent = 'لم يُحفظ · يعيد المحاولة'; setTimeout(() => { if (dirty && E) save(true); }, 4000); }); }, 500); };

// ---------- home: the events of the organisation
async function home() { E = null; const { events, org, archived = [] } = await api('/api/events'); $('#orgName').textContent = org.name;
  app.innerHTML = `<div class="hero"><div><div class="k">${esc(org.name)}</div><h2>لقاءاتكم</h2></div><div style="display:flex;gap:10px"><button class="btn" id="team">الفريق</button><button class="btn pri" id="new">لقاء جديد</button></div></div>

// ---------- files: video and image as they are; a PDF becomes slides, page by page, in this browser
const put = (q, body, type) => fetch(`/api/events/${E.id}/media?${new URLSearchParams(q)}`, { method: 'PUT', body, headers: { ...ORG, 'Content-Type': type } }).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
// a large video goes up in parts of 16 MB, each retried three times, with its progress shown
async function putBig(file, note) { const PART = 16 * 1048576, u = `/api/events/${E.id}/upload`, st = await api(u, { method: 'POST', body: JSON.stringify({ start: 1, name: file.name, type: file.type, size: file.size }) }), parts = [];
  for (let n = 1, at = 0; at < file.size; n++, at += PART) { let ok = null; for (let t = 0; t < 3 && !ok; t++) { try { const r = await fetch(`${u}?${new URLSearchParams({ key: st.key, uploadId: st.uploadId, n })}`, { method: 'PUT', headers: ORG, body: file.slice(at, at + PART) }); if (r.ok) ok = await r.json(); } catch {} } if (!ok) throw new Error('انقطع الرفع. أعد المحاولة.'); parts.push(ok); note(`${file.name}: ${Math.min(100, Math.round((at + PART) / file.size * 100))}%`); }
  await api(u, { method: 'POST', body: JSON.stringify({ done: 1, key: st.key, uploadId: st.uploadId, parts, name: file.name, size: file.size }) }); return { src: st.file }; }
async function upload(file, note) {
  const name = file.name, key = nid('f');
  if (file.type === 'application/pdf') { const pdfjs = await import('./vendor/pdf.min.mjs'); pdfjs.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';
    const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise; let id = null;
    for (let n = 1; n <= pdf.numPages; n++) { note(`${name}: الشريحة ${n} من ${pdf.numPages}`); const pg = await pdf.getPage(n), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 1920 / v0.width });
      const cv = Object.assign(document.createElement('canvas'), { width: Math.round(vp.width), height: Math.round(vp.height) }); await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .9)); const q = { kind: 'slides', name, n }; if (id) q.slides = id; id = (await put(q, blob, 'image/jpeg')).id; }
    doc.media[key] = { kind: 'slides', name: name.replace(/\.pdf$/i, ''), src: id + '/', count: pdf.numPages };
    { const v1 = (await pdf.getPage(1)).getViewport({ scale: 1 }), ratio = v1.width / v1.height; if (Math.abs(ratio - 16 / 9) > .12) toast(`«${name}» ليس بقياس 16:9، فستظهر حوله حواف على الشاشة الكبرى`); }
  } else if (file.type.startsWith('video/')) { note(`${name}: يُفحص…`);
    const probe = await new Promise(res => { const v = document.createElement('video'); v.preload = 'metadata'; v.muted = true; const t = setTimeout(() => res({ ok: false }), 15000); v.onloadedmetadata = () => { clearTimeout(t); res({ ok: v.videoWidth > 0, length: Math.round(v.duration), w: v.videoWidth, h: v.videoHeight }); }; v.onerror = () => { clearTimeout(t); res({ ok: false }); }; v.src = URL.createObjectURL(file); });
    if (!probe.ok) throw new Error(`«${name}» لا يعمل في المتصفح. حوّله إلى MP4 بترميز H.264 ثم ارفعه.`);
    if (file.size > 1500 * 1048576) throw new Error(`«${name}» أكبر من 1.5 غيغابايت. اضغطه قبل الرفع ليُحفظ سريعاً على أجهزة القاعة.`);
    note(`${name}: يُرفع…`); const r = file.size > 20 * 1048576 ? await putBig(file, note) : await put({ kind: 'video', name }, file, file.type); const length = probe.length;
    if (probe.h > probe.w) toast(`«${name}» فيديو طولي: استعمله نسخةً للشاشات الطولية في فقرته`); else if (file.size > 400 * 1048576) toast(`«${name}» كبير (${Math.round(file.size / 1048576)} ميغا): افتحوا شاشات القاعة مبكراً ليكتمل حفظه`);
    doc.media[key] = { kind: 'video', name: name.replace(/\.\w+$/, ''), src: r.src, length, w: probe.w, h: probe.h };
  } else if (file.type.startsWith('image/')) { note(`${name}: يُرفع…`); const r = await put({ kind: 'image', name }, file, file.type); doc.media[key] = { kind: 'image', name: name.replace(/\.\w+$/, ''), src: r.src }; }
  else throw new Error('نوع الملف غير مدعوم: فيديو، صورة، أو PDF'); save(); return key;
}
function media() { const b = $('#body'), used = k => doc.cues.some(c => c.media === k);
  b.innerHTML = `<div class="panel" style="max-width:960px"><div class="drop" id="drop"><b style="font-family:Kufi;color:var(--deep);font-size:18px">اسحب الملفات هنا، أو <a href="#" id="pick">اختر من جهازك</a></b><br>فيديو (MP4)، صورة، أو عرض تقديمي بصيغة PDF يتحول إلى شرائح<div id="note" style="margin-top:8px;color:var(--green);font-weight:600"></div></div><input type="file" id="fi" multiple hidden accept="video/*,image/*,application/pdf">

}

// ---------- approval and the links of the screens
async function run() { const b = $('#body'), L = { stage: 'الشاشة الكبرى', side: 'شاشة جانبية (أسماء وعناوين)', logo: 'شاشة شعار ثابتة', tablet: 'جهاز ضيف الشرف', console: 'لوحة المشغّل', script: 'صفحة مدير الجلسة', clicker: 'مقلّب الشرائح (جوال المتحدث)', audience: 'صفحة الحضور (رابط واحد للجميع)' }; probs = problems(doc);
  const { links } = await api(`/api/events/${E.id}/links`);
  b.innerHTML = `<div class="split" style="grid-template-columns:1fr 1fr"><div class="panel"><h3 style="font-size:19px;color:var(--deep);margin-bottom:12px">جاهزية اللقاء</h3>${probs.length ? probs.map(p => `<div class="prob">${esc(p)}</div>`).join('') : '<div class="okb">اللقاء مكتمل ويمكن اعتماده.</div>'}
    <p style="color:var(--mute);font-size:14px">«بروفة» تشغّل المسودة في غرفة مستقلة لا يراها أحد. «اعتماد النسخة» يجمّد المسودة، وتقرؤها شاشات القاعة فوراً، وتبقى المسودة قابلة للتعديل بجانبها.</p>
    <h3 style="font-size:19px;color:var(--deep);margin:22px 0 8px">تفعيل يوم اللقاء</h3>
    ${E.active_until && new Date(E.active_until) > new Date() ? `<div class="okb">مفعّل: شاشات القاعة تفتح من ${new Date(E.active_from).toLocaleString('ar', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })} حتى ${new Date(E.active_until).toLocaleString('ar', { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}</div>`
      : `<p style="color:var(--mute);font-size:14px;margin:0 0 10px">شاشات القاعة تفتح في يوم التفعيل فقط (من مساء اليوم السابق للتجهيز حتى نهاية اليوم). في رصيدكم <b style="color:var(--gold)">${E.credits}</b> يوم.</p><div class="row" style="grid-template-columns:220px auto 1fr"><input type="date" id="actDay" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px"><button class="btn gold" id="act" ${E.published_version && E.credits ? '' : 'disabled'}>تفعيل هذا اليوم</button><span></span></div>`}</div>
    <div class="panel"><h3 style="font-size:19px;color:var(--deep)">روابط الشاشات</h3><p style="color:var(--mute);font-size:14px;margin:4px 0 10px">لكل شاشة أو شخص رابط خاص بلا حساب، وأي عدد من الشاشات بأي مقاس، طولية أو عرضية. افتحوا كل رابط على جهازه قبل اللقاء فيحفظ ملفاته ويعمل بلا اعتماد على الشبكة. يظهر الرابط مرة واحدة عند إنشائه، ويُلغى بضغطة.</p>
    <div class="row" style="grid-template-columns:200px 1fr auto"><select id="lr">${Object.entries(L).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><input type="text" id="ll" placeholder="وصف (مثل: جهاز القاعة)"><button class="btn pri" id="la" ${E.published_version ? '' : 'disabled'}>إنشاء رابط</button></div>
    ${E.published_version ? '' : '<p style="color:var(--bad);font-size:14px">اعتمد نسخة أولاً لتعمل الروابط.</p>'}<div id="lo"></div>
    ${links.map(l => `<div class="link"><b style="font-family:Kufi">${L[l.role]}</b><span>${esc(l.label)}</span><button class="btn sm bad" data-rv="${l.id}">إلغاء</button></div>`).join('')}</div></div>`;
  // the published versions: any of them can come back as the draft
  if (E.published_version) api(`/api/events/${E.id}/versions`, { soft: true }).then(v => { const host = b.querySelector('.split .panel'); if (!host || !v.versions || tab !== 'run') return; const box = document.createElement('div'); box.id = 'vers';
    box.innerHTML = `<h3 style="font-size:19px;color:var(--deep);margin:22px 0 4px">النسخ المعتمدة</h3>${v.versions.map(x => `<div class="vrow"><b>النسخة ${x.version}${x.version === v.current ? ' · على الشاشات' : ''}</b><span style="color:var(--mute)">${new Date(x.at).toLocaleString('ar', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}${x.by ? ' · <span dir="ltr">' + esc(x.by) + '</span>' : ''}</span><button class="btn sm" data-rs="${x.version}">استرجاعها إلى المسودة</button></div>`).join('')}`; host.appendChild(box);
    box.querySelectorAll('[data-rs]').forEach(x => x.onclick = async () => { if (!(await ask({ title: 'استرجاع النسخة ' + x.dataset.rs, text: 'تصير هذه النسخة هي المسودة، وتُستبدل بها تعديلاتك الحالية. الشاشات لا تتغير حتى تعتمد.', ok: 'استرجاع' }))) return; clearTimeout(st); await api(`/api/events/${E.id}/restore`, { method: 'POST', body: JSON.stringify({ version: +x.dataset.rs }) }); await open(E.id, 'run'); toast('عادت النسخة ' + x.dataset.rs + ' إلى المسودة'); }); });
  if (E.published_version) api(`/api/events/${E.id}/report`, { soft: true }).then(r => { const host = b.querySelector('.split .panel'); if (!host || !r.rows || !r.rows.length || tab !== 'run') return; const f = ms => { const s2 = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s2 / 60)}:${String(s2 % 60).padStart(2, '0')}`; }, hm = t => new Date(t).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' }), box = document.createElement('div'); box.id = 'rep';
    box.innerHTML = `<h3 style="font-size:19px;color:var(--deep);margin:22px 0 4px">تقرير اللقاء</h3><p style="color:var(--mute);font-size:14px;margin:0 0 8px">${r.running ? 'اللقاء جارٍ الآن. ' : ''}من ${hm(r.from)} إلى ${hm(r.to)} · المدة ${f(r.to - r.from)}${r.launchAt ? ' · التدشين ' + hm(r.launchAt) : ''}</p>
      ${r.rows.map(x => `<div class="vrow" style="grid-template-columns:70px 1fr 110px"><span dir="ltr" style="color:var(--mute)">${hm(x.at)}</span><b>${esc(x.title)}</b><span dir="ltr" style="text-align:left;${x.planned && x.ms > x.planned ? 'color:var(--bad);font-weight:700' : 'color:var(--mute)'}">${f(x.ms)}${x.planned ? ' / ' + f(x.planned) : ''}</span></div>`).join('')}<button class="btn sm" id="repP" style="margin-top:12px">طباعة التقرير</button>`; host.appendChild(box);
    $('#repP').onclick = () => { const w = window.open('', '_blank'); w.document.write(`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>تقرير ${esc(r.name)}</title><style>body{font-family:Tahoma,Arial,sans-serif;max-width:760px;margin:40px auto;color:#1F2A2E}h1{font-size:24px}table{width:100%;border-collapse:collapse;margin-top:16px}td,th{padding:9px 6px;border-bottom:1px solid #ddd;text-align:right}th{color:#777;font-weight:600;font-size:13px}.o{color:#A8402F;font-weight:700}</style></head><body><h1>تقرير اللقاء: ${esc(r.name)}</h1><p>${new Date(r.from).toLocaleDateString('ar', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })} · من ${hm(r.from)} إلى ${hm(r.to)} · المدة ${f(r.to - r.from)}${r.launchAt ? ' · التدشين ' + hm(r.launchAt) : ''}</p><table><tr><th>الوقت</th><th>الفقرة</th><th>المدة الفعلية</th><th>المقدَّرة</th></tr>${r.rows.map(x => `<tr><td>${hm(x.at)}</td><td>${esc(x.title)}</td><td class="${x.planned && x.ms > x.planned ? 'o' : ''}">${f(x.ms)}</td><td>${x.planned ? f(x.planned) : ''}</td></tr>`).join('')}</table></body></html>`); w.document.close(); w.print(); }; });
  const act = $('#act'); if (act) act.onclick = async () => { const d = $('#actDay').value; if (!d) return toast('اختر يوم اللقاء'); if (!(await ask({ title: 'تفعيل يوم اللقاء', text: 'يُخصم يوم واحد من رصيدكم، وتفتح شاشات القاعة في ' + d + ' ومن مساء اليوم السابق للتجهيز.', ok: 'تفعيل اليوم' }))) return; const r = await api(`/api/events/${E.id}/activate`, { method: 'POST', body: JSON.stringify({ from: new Date(d + 'T00:00:00').toISOString() }) }); Object.assign(E, r); toast('فُعّل يوم اللقاء'); run(); };
  if (!$('#la')) return;   // the tab was left while its data was on the way
  $('#la').onclick = async () => { const r = await api(`/api/events/${E.id}/links`, { method: 'POST', body: JSON.stringify({ role: $('#lr').value, label: $('#ll').value }) }); await run(); const u = location.origin + r.url; $('#lo').innerHTML = `<div class="okb" style="margin:10px 0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center"><div>الرابط يظهر هذه المرة فقط. انسخه، أو صوّر الرمز بجهاز الشاشة:<br><code dir="ltr" id="newLink" style="word-break:break-all">${u}</code><br><button class="btn pri sm" id="cpL" style="margin-top:8px">نسخ الرابط</button></div><canvas id="qrL" width="264" height="264" style="width:132px;height:132px;background:#fff;border-radius:10px;padding:6px"></canvas></div>`;
    $('#cpL').onclick = async () => { try { await navigator.clipboard.writeText(u); toast('نُسخ الرابط'); } catch { toast('انسخه يدوياً من النص'); } };
    try { const q = qrcode(0, 'M'); q.addData(u); q.make(); const n = q.getModuleCount(), g = $('#qrL').getContext('2d'), z = 264 / n; g.fillStyle = '#fff'; g.fillRect(0, 0, 264, 264); g.fillStyle = '#0E1114'; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(x * z, y * z, z + .5, z + .5); } catch {} };
  b.querySelectorAll('[data-rv]').forEach(x => x.onclick = async () => { await api(`/api/events/${E.id}/links/${x.dataset.rv}`, { method: 'DELETE' }); toast('أُلغي الرابط'); run(); });
}

// ---------- start
$('#home').onclick = e => { e.preventDefault(); home(); };
ME = await api('/api/me', { soft: true });
if (!ME.user) { const door = SLUG || '', known = SLUG ? localStorage.getItem('door:' + SLUG) || '' : '';   // door: an organisation's own address; its name shows only on a device that has entered it before
  // at an organisation's own address: its name over the door and one field, the password. At /login: email and password
  app.innerHTML = `<div id="gate"><img src="brand/mark.png" alt="بصيرة" style="height:130px;margin-bottom:14px"><div class="k">بصيرة · استوديو اللقاءات</div><h2 style="font:900 32px Kufi;color:var(--deep);margin:8px 0 18px">${known ? esc(known) : 'الدخول'}</h2>
  <form id="lf2" style="max-width:380px;margin:0 auto;display:grid;gap:10px">${door ? '' : `<input type="email" id="lE" placeholder="البريد" dir="ltr" autocomplete="username" required style="border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-align:center;font-size:17px">`}<div class="pwf"><input type="password" id="lP" placeholder="كلمة المرور" dir="ltr" lang="en" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><span role="button" tabindex="0" class="eye" data-eye="lP" title="إظهار ما كُتب أو إخفاؤه">إظهار</span></div><div class="pwh" id="lPH"></div><button class="btn pri" style="padding:12px;font-size:17px">دخول</button></form>
  <button class="btn gold" id="pkIn" style="margin-top:12px;padding:11px 28px;font-size:16px">الدخول بمفتاح المرور</button></div>`;
  pwField('lP'); $('#lP').focus();
  $('#lf2').onsubmit = async e => { e.preventDefault(); try { const r = await api('/api/login', { method: 'POST', body: JSON.stringify(door ? { slug: SLUG, password: $('#lP').value } : { email: $('#lE').value, password: $('#lP').value }) }); if (r.name) localStorage.setItem('door:' + SLUG, r.name); location.href = r.to; } catch (x) { $('#lPH').textContent = (x && x.message && x.message !== 'undefined' ? x.message + '. ' : '') + 'اضغط «إظهار» لترى ما كتبت، وتأكد أن لوحة المفاتيح بالإنجليزية.'; $('#lP').select(); } }; }
else if (!SLUG && ME.orgs[0]) location.replace('/' + ME.orgs[0].slug);   // signed in at /login: on to the organisation's own address
else if (SLUG && !ME.orgs.some(o => o.slug === SLUG)) app.innerHTML = `<div id="gate"><img src="brand/mark.png" alt="بصيرة" style="height:130px;margin-bottom:14px"><h2 style="font:900 30px Kufi;color:var(--deep);margin:8px 0">لا صلاحية لك على هذا العنوان</h2><p style="color:var(--mute)">حسابك لا ينتمي إلى هذه الجهة.</p>${ME.orgs[0] ? `<a class="btn pri" href="/${ME.orgs[0].slug}" style="display:inline-block;margin-top:16px;text-decoration:none">العودة إلى جهتي</a>` : ''}</div>`;
else home();
if (ME.user) { const w = $('#pwSet'); w.style.display = ''; w.onclick = async e => { e.preventDefault(); const p1 = await ask({ title: 'كلمة مرور جديدة', text: 'ثمانية أحرف على الأقل. تُنهى جلساتك على الأجهزة الأخرى.', input: { placeholder: 'كلمة المرور الجديدة', ltr: true }, ok: 'حفظ' }); if (!p1) return; try { await api('/api/password', { method: 'POST', body: JSON.stringify({ password: p1 }) }); toast('حُفظت كلمة المرور الجديدة'); } catch {} }; }
// passkeys: add one once signed in; sign in with it next time
import('./passkey.js').then(PK => { const add = $('#pk'), inb = $('#pkIn'); if (!PK.supported()) { add.style.display = 'none'; if (inb) inb.style.display = 'none'; return; }
  if (!ME.user) add.style.display = 'none'; add.onclick = async e => { e.preventDefault(); try { await PK.register(); toast('أُضيف مفتاح المرور لهذا الجهاز'); } catch (x) { toast(x.name === 'NotAllowedError' ? 'أُلغيت العملية' : x.message); } };
  if (inb) inb.onclick = async () => { try { const r = await PK.login(); location.href = r.to; } catch (x) { toast(x.name === 'NotAllowedError' ? 'أُلغيت العملية' : x.message); } }; });
</script></body></html>
