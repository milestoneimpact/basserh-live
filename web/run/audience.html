<!doctype html>
<!-- The page in the hands of the audience (one link for everyone, usually behind a QR code on the screens): the programme of the event,
     the cue on now, and a question to send. It is told only what the audience may know: no moderator's words, and nothing of a new
     identity before the launch has shown it. It asks the server every few seconds; it holds no connection open. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>برنامج اللقاء</title><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="../fonts/brand.css">
<style>
header h1,#nowT,.it b,#send{font-family:var(--ft,Kufi)!important}body{background:var(--bg,#F6F1E6);color:var(--ink,#14211E);transition:background .8s,color .8s;min-height:100vh}main{max-width:620px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;padding:14px 0 8px}header img{max-height:84px;max-width:60%}header h1{font:900 24px/1.5 Kufi;color:var(--accent,#0F5A4E);margin-top:10px}
.card{background:color-mix(in srgb,var(--bg,#F6F1E6) 93%,var(--ink,#14211E));border:1px solid color-mix(in srgb,var(--ink,#14211E) 16%,transparent);border-radius:18px;padding:18px;margin-top:14px;box-shadow:0 10px 26px rgba(0,0,0,.06)}
.k{font:600 13px Plex;color:color-mix(in srgb,var(--ink,#14211E) 62%,var(--gold,#C2A063));letter-spacing:.06em}#nowT{font:900 26px/1.5 Kufi;color:var(--accent,#0F5A4E)}#nowW{color:color-mix(in srgb,var(--ink,#14211E) 70%,transparent);font-size:15px}
.it{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:11px 0;border-top:1px solid color-mix(in srgb,var(--gold,#C2A063) 25%,transparent);align-items:start}.it:first-child{border:0}
.it i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 14px Plex;font-style:normal;border:1px solid color-mix(in srgb,var(--ink,#14211E) 40%,transparent);color:color-mix(in srgb,var(--ink,#14211E) 70%,transparent)}.it b{font:700 16px Kufi;display:block}.it small{font-size:13.5px;color:color-mix(in srgb,var(--ink,#14211E) 65%,transparent)}
.it.done{opacity:.5}.it.done i{background:color-mix(in srgb,var(--ink,#14211E) 45%,var(--bg,#fff));border-color:transparent;color:var(--bg,#fff)}.it.now i{background:var(--accent,#0F5A4E);border-color:var(--accent,#0F5A4E);color:var(--bg,#fff);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent,#0F5A4E) 18%,transparent)}.it.now b{color:var(--accent,#0F5A4E)}
textarea,input[type=text]{width:100%;border:1px solid color-mix(in srgb,var(--ink,#14211E) 25%,transparent);border-radius:12px;padding:11px 13px;background:color-mix(in srgb,var(--bg,#fff) 86%,#fff);color:var(--ink,#14211E);font:400 16px/1.7 Plex;outline:none;margin-top:10px}
#send{width:100%;margin-top:12px;border:0;border-radius:14px;padding:14px;font:900 18px Kufi;color:var(--bg,#fff);background:var(--accent,#0F5A4E);cursor:pointer}#send:disabled{opacity:.5}#qMsg{margin-top:10px;font-weight:600;min-height:1.6em}
#wait{text-align:center;color:color-mix(in srgb,var(--ink,#14211E) 65%,transparent);padding:6px 0}
</style></head><body><main>
<header><img id="lg" alt="" style="display:none"><h1 id="nm"></h1></header>
<div class="card" id="nowC" style="display:none"><div class="k">الآن</div><div id="nowT"></div><div id="nowW"></div></div>
<div id="wait" style="display:none">لم يبدأ اللقاء بعد. هذا برنامجه.</div>
<div class="card"><div class="k" style="margin-bottom:6px">برنامج اللقاء</div><div id="list"></div></div>
<div class="card" id="askC" style="display:none"><div class="k">سؤال للمنصة</div><textarea id="qT" rows="3" maxlength="300" placeholder="اكتب سؤالك هنا"></textarea><input type="text" id="qW" maxlength="60" placeholder="اسمك (اختياري)"><button id="send">إرسال السؤال</button><div id="qMsg"></div></div>
</main>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const Q = new URLSearchParams(location.search), E = Q.get('e'), DR = Q.has('draft') ? '?draft' : ''; let last = '';
async function pull() { let r, d; try { r = await fetch(`/api/run/${E}/pub${DR}`); d = await r.json(); } catch { return; }
  if (!r.ok) { $('main').innerHTML = `<p style="text-align:center;margin-top:30vh;font:600 20px Plex;color:#888">${esc(d.error || 'تعذّر فتح الصفحة')}</p>`; return; }
  const key = JSON.stringify(d); if (key === last) return; last = key;
  for (const [k, v] of Object.entries({ bg: d.colors.bg, ink: d.colors.ink, accent: d.colors.accent, gold: d.colors.gold, ft: d.font })) if (v) document.documentElement.style.setProperty('--' + k, v);
  { const L = h => { h = String(h || '#fff').replace('#', ''); const v = [0, 2, 4].map(i => { let x = (parseInt(h.slice(i, i + 2), 16) || 0) / 255; return x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4; }); return .2126 * v[0] + .7152 * v[1] + .0722 * v[2]; }, C = (a, b) => (Math.max(L(a), L(b)) + .05) / (Math.min(L(a), L(b)) + .05), bg = d.colors.bg || '#F6F1E6', ink = d.colors.ink || '#14211E';
    if (C(ink, bg) < 3) document.documentElement.style.setProperty('--ink', L(bg) > .4 ? '#14211E' : '#F6F2E8'); if (C(d.colors.accent || '#0F5A4E', bg) < 2.6) document.documentElement.style.setProperty('--accent', C(ink, bg) < 3 ? (L(bg) > .4 ? '#14211E' : '#F6F2E8') : ink); }
  document.title = d.name; $('#nm').textContent = d.name; const lg = $('#lg'); if (d.logo) { if (lg.getAttribute('src') !== d.logo) lg.src = d.logo; lg.style.display = ''; } else lg.style.display = 'none';
  const at = d.cues.findIndex(c => c.id === d.cue), cur = d.cues[at]; $('#wait').style.display = d.live ? 'none' : ''; $('#nowC').style.display = d.live && cur ? '' : 'none'; if (cur) { $('#nowT').textContent = cur.title; $('#nowW').textContent = cur.who; }
  $('#list').innerHTML = d.cues.map((c, i) => `<div class="it${d.live && at >= 0 && i < at ? ' done' : ''}${d.live && i === at ? ' now' : ''}"><i>${d.live && at >= 0 && i < at ? '✓' : i + 1}</i><span><b>${esc(c.title)}</b>${c.who ? `<small>${esc(c.who)}</small>` : ''}</span></div>`).join('') || '<p style="opacity:.6">يُعلن البرنامج قريباً.</p>';
  $('#askC').style.display = d.ask && d.live ? '' : 'none'; }
$('#send').onclick = async () => { const t = $('#qT').value.trim(); if (t.length < 3) { $('#qMsg').style.color = '#A8402F'; $('#qMsg').textContent = 'اكتب سؤالك أولاً'; return $('#qT').focus(); } $('#send').disabled = true; const m = $('#qMsg');
  try { const r = await fetch(`/api/run/${E}/ask${DR}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t, name: $('#qW').value }) }), j = await r.json(); m.style.color = r.ok ? 'var(--accent,#0F5A4E)' : '#A8402F'; m.textContent = r.ok ? 'وصل سؤالك. شكراً لك.' : (j.error || 'تعذّر الإرسال'); if (r.ok) $('#qT').value = ''; }
  catch { m.style.color = '#A8402F'; m.textContent = 'لا اتصال. حاول مرة أخرى.'; } setTimeout(() => { $('#send').disabled = false; }, 4000); };
pull(); setInterval(() => { if (!document.hidden) pull(); }, 5000); document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
</script></body></html>
