<!doctype html>
<!-- /screen: the address a touch screen is set to open at every start (Chrome in kiosk mode, the home page of a tablet).
     The first time it shows six digits; the operator types them on the stations' board and picks the station, and the screen becomes it.
     From then on it goes straight to its station at every start, until its link is cancelled: then it shows a new code. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ربط الشاشة · بصيرة</title><link rel="icon" href="../brand/icon.png"><link rel="stylesheet" href="../app.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body{background:radial-gradient(70% 60% at 50% 40%,#16231F,#0B0F11 70%);color:#E9E2D0;display:grid;place-items:center;text-align:center;font-family:Plex}
img{height:clamp(70px,11vh,130px)}h1{font:900 clamp(26px,3.4vw,46px) Kufi;color:#E4CC97;margin:2vh 0 0}
#code{font:600 clamp(80px,14vw,220px)/1 Corm,serif;letter-spacing:.12em;color:#fff;margin:4vh 0 1vh;direction:ltr}#code span{display:inline-block;margin:0 .04em}
p{font:400 clamp(16px,1.6vw,24px)/1.9 Plex;color:#B9C2C0;margin:0 auto;max-width:900px}b{color:#E4CC97}
.bar{width:min(420px,60vw);height:4px;border-radius:2px;background:#24322F;margin:4vh auto 0;overflow:hidden}.bar i{display:block;height:100%;background:#C9A45A;width:100%;transition:width 1s linear}
#msg{margin-top:2vh;color:#8FE3B5;min-height:1.9em}
</style></head><body>
<div><img src="../brand/mark_light.png" alt="بصيرة"><h1>ربط هذه الشاشة بمحطتها</h1><div id="code">······</div>
<p>في <b>لوحة المحطات</b> اضغطوا <b>«ربط شاشة»</b>، واكتبوا هذا الرمز، واختاروا المحطة. تتحول الشاشة إليها فوراً، وتفتحها وحدها في كل تشغيل بعد ذلك.</p>
<div class="bar"><i id="t"></i></div><div id="msg"></div></div>
<script>
for (const t of ['contextmenu', 'selectstart', 'dragstart']) addEventListener(t, e => e.preventDefault());
if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js').catch(() => {});
const SLUG = (location.pathname.match(/^\/([a-z0-9][a-z0-9-]{1,39})\/screen\/?$/) || [])[1] || '';   // opened at an organisation's own address: its codes are for it alone
const K = 'screen:go', $ = s => document.querySelector(s), go = u => { location.replace(u); };
async function start() {
  // a screen already paired: to its station, unless its link was cancelled. With no network it still goes: the station opens from its saved copy
  const saved = localStorage.getItem(K);
  if (saved) { try { const r = await fetch(saved, { redirect: 'manual', cache: 'no-store' }); if (r.type === 'opaqueredirect' || (r.status >= 300 && r.status < 400)) return go(saved); if (r.status === 410) { localStorage.removeItem(K); $('#msg').textContent = 'أُلغي رابط المحطة السابق. اربطوا الشاشة من جديد.'; } else return go(saved); } catch { return go(localStorage.getItem('screen:url') || saved); } }   // no network: straight to the station page it keeps
  code();
}
let poll = 0, tick = 0;
async function code() { clearInterval(poll); clearInterval(tick); let c;
  try { const r = await fetch('/api/pair/new', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(SLUG ? { slug: SLUG } : {}) }); c = await r.json(); if (!r.ok) throw new Error(c.error); } catch (x) { $('#code').textContent = '······'; $('#msg').textContent = (x && x.message) || 'لا اتصال بالشبكة. يعيد المحاولة.'; return setTimeout(code, 8000); }
  $('#code').innerHTML = c.code.split('').map(d => `<span>${d}</span>`).join(''); if (c.org) $('h1').textContent = 'ربط هذه الشاشة · ' + c.org; const end = Date.now() + (c.ttl - 15) * 1000;
  tick = setInterval(() => { const left = end - Date.now(); $('#t').style.width = Math.max(0, left / ((c.ttl - 15) * 1000) * 100) + '%'; if (left <= 0) code(); }, 1000);
  poll = setInterval(async () => { try { const r = await (await fetch(`/api/pair/${c.code}?s=${c.secret}`, { cache: 'no-store' })).json(); if (r.go) { clearInterval(poll); clearInterval(tick); localStorage.setItem(K, r.go); $('#msg').textContent = 'رُبطت الشاشة. تفتح محطتها…'; setTimeout(() => go(r.go), 600); } else if (r.gone) code(); } catch {} }, 2000); }
start();
</script></body></html>
