<!doctype html>
<!-- The moderator's page: his words cue by cue in the running order, the current one lit. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نص مدير الجلسة</title><link rel="icon" href="../brand/icon.png"><link rel="stylesheet" href="../app.css">
<style>body{background:var(--paper);max-width:860px;margin:0 auto;padding:26px 22px 60vh}h1{font:900 26px Kufi;color:var(--deep);margin-bottom:18px}section{padding:18px 20px;border-radius:14px;margin-bottom:10px;opacity:.5;border:1px solid transparent;transition:.4s}
section.now{opacity:1;background:#fff;border-color:var(--gold);box-shadow:0 14px 40px rgba(14,17,20,.08)}section.next{opacity:.85}h2{font:700 16px Kufi;color:var(--gold);margin-bottom:6px}p{font:400 26px/1.9 Plex;margin:0 0 8px}p.note{font-size:17px;color:var(--mute)}body{font-size:var(--z,100%)}section p{font-size:calc(26px*var(--zf,1))}
#word{position:fixed;inset:0 0 auto 0;z-index:5;background:#8E2A1E;color:#fff;font:900 clamp(30px,7vw,64px)/1.5 Kufi;text-align:center;padding:14px 20px;transform:translateY(-110%);transition:transform .35s;box-shadow:0 12px 40px rgba(0,0,0,.3)}#word.on{transform:none}
#zoom{position:fixed;left:14px;bottom:14px;display:flex;gap:6px;z-index:4}#zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 18px Plex;cursor:pointer;color:var(--deep)}</style></head><body><div id="word"></div><h1 id="t"></h1><div id="list"></div><div id="zoom"><button data-z="1.12">+</button><button data-z="0.89">−</button></div>
<script type="module">
import { connect, $, esc, cueOf, shown } from './run.js'; const link = await connect(), D = link.doc; $('#t').textContent = D.name; let key = '', last = '';
let zf = +localStorage.getItem('zf') || 1; const zoom = () => document.documentElement.style.setProperty('--zf', zf); zoom(); document.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { zf = Math.max(.7, Math.min(2.2, zf * +b.dataset.z)); localStorage.setItem('zf', zf); zoom(); });
let wordAt = 0;
link.on(s => { { const w = $('#word'), n = s.note; if (n && n.at !== wordAt) { wordAt = n.at; navigator.vibrate?.([80, 60, 80]); } w.textContent = n ? n.text : w.textContent; w.classList.toggle('on', !!n && link.now() - n.at < 30000); clearTimeout(w.t); if (n) w.t = setTimeout(() => w.classList.remove('on'), Math.max(0, 30000 - (link.now() - n.at))); }
  document.body.style.visibility = s.live ? '' : 'hidden'; if (!s.live) return;
  const sh = shown(D, s), k = sh.join(); if (k !== key) { key = k; $('#list').innerHTML = sh.map(id => cueOf(D, id)).filter(c => (c.moderator || []).length).map(c => `<section data-id="${c.id}"><h2>${esc(c.title)}</h2>${c.moderator.map(l => `<p class="${l.startsWith('[') ? 'note' : ''}">${esc(l)}</p>`).join('')}</section>`).join(''); last = ''; }
  const nx = sh[sh.indexOf(s.cue) + 1]; document.querySelectorAll('section').forEach(el => { el.classList.toggle('now', el.dataset.id === s.cue); el.classList.toggle('next', el.dataset.id === nx); });
  if (s.cue !== last) { last = s.cue; document.querySelector('section.now')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
</script></body></html>
