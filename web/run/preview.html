<!doctype html>
<!-- The rehearsal in one page, for the members of the organisation: every screen of the hall as it will look (a wide one, a tall one,
     the fixed logo screen), the guests' devices, and the operator's console that moves them all. Runs the draft in its own room. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بروفة اللقاء</title><link rel="icon" href="../brand/icon.png"><link rel="stylesheet" href="../app.css">
<style>body{background:#0A0D0F;color:var(--cream);margin:0}header{padding:12px 22px;display:flex;gap:14px;align-items:center;border-bottom:1px solid rgba(228,204,151,.18)}header h1{font:900 18px Kufi}header span{font:400 14px Plex;color:#A9B2B4}
.wm:before{background-image:url(../brand/mark_light.png)}
#wall{display:grid;grid-template-columns:minmax(0,3.2fr) minmax(0,1fr) minmax(0,1.6fr);gap:14px;padding:14px 22px;align-items:start}
figure{margin:0}figcaption{font:600 13px Plex;color:var(--gold2);margin-bottom:6px;display:flex;justify-content:space-between}figcaption small{color:#8C979A;font-weight:400}
.fr{position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(228,204,151,.25);background:#000}.fr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.w{aspect-ratio:16/9}.t{aspect-ratio:9/16}.sq{aspect-ratio:4/3}.col{display:grid;gap:14px}#tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
#con{height:1000px;border-radius:12px;overflow:hidden;border:1px solid rgba(228,204,151,.25)}#con iframe{width:100%;height:100%;border:0}
.b{border:1px solid rgba(228,204,151,.3);background:#1F2A2E;color:var(--cream);border-radius:9px;padding:6px 14px;cursor:pointer;font:600 14px Plex;text-decoration:none}
@media(max-width:1000px){#wall{grid-template-columns:1fr 1fr}#wall figure:first-child{grid-column:1/-1}}
/* the light dress: paper and white, charcoal ink, gold for what matters */
header{background:#fff;color:var(--deep);border-bottom:1px solid var(--line);box-shadow:0 2px 16px rgba(14,17,20,.05)}.wm{color:var(--deep)}.wm:before{background-image:url(../brand/mark.png)}.wm span{color:#8E6626}
body{background:var(--paper);color:var(--ink)}header h1{color:var(--deep)}header span{color:var(--mute)}figcaption{color:#8E6626}figcaption small{color:var(--mute)}
.fr{border:1px solid var(--line);box-shadow:0 10px 26px rgba(14,17,20,.12)}#con{border:1px solid var(--line);box-shadow:0 10px 26px rgba(14,17,20,.08)}.b{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#FAF6EC);color:var(--deep)}.b:hover{border-color:var(--gold)}
</style></head><body>
<header><div class="wm" style="font-size:19px">بصيرة<i></i></div><h1>بروفة اللقاء</h1><span>تعمل على المسودة في غرفة مستقلة، ولا يراها أحد خارج الفريق</span><span style="flex:1"></span><a class="b" id="full" target="_blank">الشاشة الكبرى في نافذة كاملة</a></header>
<div id="wall"><div class="col"><figure><figcaption><span>الشاشة الكبرى</span><small>عرضية 16:9</small></figcaption><div class="fr w"><iframe data-s="stage.html?"></iframe></div></figure>
    <div id="con"><iframe data-s="console.html?"></iframe></div></div>
  <div class="col"><figure><figcaption><span>شاشة طولية</span><small>9:16</small></figcaption><div class="fr t"><iframe data-s="stage.html?"></iframe></div></figure>
    <figure><figcaption><span>جوال المتحدث</span><small>مقلّب الشرائح</small></figcaption><div class="fr t"><iframe data-s="clicker.html?"></iframe></div></figure></div>
  <div class="col"><figure><figcaption><span>شاشة شعار ثابتة</span><small>لا تتبع الفقرات إلا في التدشين</small></figcaption><div class="fr w"><iframe data-s="stage.html?logo&"></iframe></div></figure>
    <figure><figcaption><span>شاشة جانبية</span><small>الأسماء والعناوين</small></figcaption><div class="fr sq"><iframe data-s="stage.html?side&"></iframe></div></figure>
    <figure><figcaption><span id="tl">جهاز ضيف الشرف</span><small>اضغط مطوّلاً عند الدعوة</small></figcaption><div id="tabs"></div></figure></div></div>
<script type="module">
const e = new URLSearchParams(location.search).get('e'), q = `e=${e}&draft&mute`;
// how many guests press together: as many devices are shown
let hands = 1; try { const c = await (await fetch(`/api/run/${e}/config?draft`)).json(); const L = (c.doc.cues || []).find(x => x.type === 'launch'); hands = Math.max(1, Math.min(6, Math.round(+(L && L.hands) || 1))); if (!L) document.querySelector('#tabs').closest('figure').style.display = 'none'; } catch {}
if (hands > 1) document.querySelector('#tl').textContent = `أجهزة الضيوف (${hands})`;
document.querySelector('#tabs').innerHTML = Array.from({ length: hands }, () => '<div class="fr sq"><iframe data-s="tablet.html?"></iframe></div>').join('');
document.querySelectorAll('iframe').forEach(f => { f.src = f.dataset.s + q; }); document.querySelector('#full').href = `stage.html?e=${e}&draft`;
</script></body></html>
