<!doctype html>
<!-- A screen of the hall, of any size and either way up. Three kinds from the same page:
     the big screen (follows every cue), a side screen (?side: names and titles, never the slides or the videos),
     and a fixed logo screen (?logo: the logo alone, whatever the cue; it joins the others at the launch only).
     ?mute: inside the studio's preview (no sound, no click to start, not counted among the hall's devices). -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشاشة</title><link rel="stylesheet" href="../app.css">
<style>
html,body{height:100%;overflow:hidden;background:#000}
/* the canvas takes the shape of the screen: 1080 on its short side, as long as the screen on the other; --k shrinks the type on narrow ones */
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;--W:1920px;--H:1080px;--k:1;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Kufi;transition:background 1.2s}
.sc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s ease,transform 1s ease,clip-path 1s ease,visibility 0s linear 1s}
.sc.on{opacity:1;visibility:visible;z-index:2;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),clip-path 1.1s ease}
.tr-rise .sc{transform:translateY(54px)}.tr-zoom .sc{transform:scale(1.08)}.tr-rise .sc.on,.tr-zoom .sc.on{transform:none}
.tr-wipe .sc{clip-path:inset(0 0 0 100%)}.tr-wipe .sc.on{clip-path:inset(0)}
.tr-blur .sc{filter:blur(26px);transition:opacity 1s ease,filter 1.1s ease,visibility 0s linear 1s}.tr-blur .sc.on{filter:none;transition:opacity 1s ease,filter 1.3s ease}
.tr-iris .sc{clip-path:circle(0 at 50% 50%)}.tr-iris .sc.on{clip-path:circle(75% at 50% 50%);transition:opacity .6s ease,clip-path 1.3s cubic-bezier(.3,.7,.2,1)}
.sc>div{max-width:calc(var(--W) - 180px)}#rev>div{max-width:none}#rev .in{max-width:calc(var(--W) - 180px)}
.frame{position:absolute;inset:34px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);pointer-events:none;z-index:3}
video,.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.sl{background:var(--bg);opacity:0;transition:opacity .5s}.sl.on{opacity:1}
.lg{max-height:300px;max-width:min(760px,calc(var(--W)*.62))}.lg.s{max-height:150px;max-width:min(420px,calc(var(--W)*.4))}
.only .lg{max-height:calc(var(--H)*.42);max-width:calc(var(--W)*.64)}
.hon{font:400 calc(34px*var(--k)) Plex;color:var(--gold);margin-top:44px}.nm{font:900 calc(96px*var(--k))/1.3 Kufi;color:var(--accent);margin-top:8px;text-wrap:balance}
.big{font:900 calc(110px*var(--k))/1.4 Kufi;color:var(--accent);text-wrap:balance}.sub{font:400 calc(38px*var(--k)) Plex;color:var(--gold);margin-top:18px}
#idle .big{font-size:calc(72px*var(--k));margin-top:40px}#idle .big:empty,#rev .big:empty,.sub:empty{display:none}
.rule{width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:40px auto 0}
#arm{background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)}#arm i{display:block;width:260px;height:260px;border-radius:50%;border:1px solid rgba(228,204,151,.55);box-shadow:0 0 120px rgba(228,204,151,.4),inset 0 0 70px rgba(228,204,151,.2);animation:pulse 3.2s ease-in-out infinite;margin:0 auto}
#hands{display:flex;gap:26px;justify-content:center;margin-top:70px}#hands b{width:30px;height:30px;border-radius:50%;border:2px solid rgba(228,204,151,.7);transition:background .3s,box-shadow .3s}#hands b.on{background:#E4CC97;box-shadow:0 0 34px #E4CC97}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
/* a launch the screen draws itself: every part is an animation placed on the server's clock by its delay, so all screens move as one */
#rev .dark{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)}
#rev .cd{position:absolute;inset:0;display:grid;place-items:center}#rev .cd b{grid-area:1/1;font:900 calc(520px*var(--k))/1 Kufi;color:#E4CC97;text-shadow:0 0 90px rgba(228,204,151,.55);opacity:0}
#rev .ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px;border-radius:50%;border:2px solid #E4CC97;box-shadow:0 0 160px 40px rgba(228,204,151,.5),inset 0 0 90px rgba(228,204,151,.45);opacity:0}
#rev .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,#F3E2B8 40%,rgba(243,226,184,0) 75%);opacity:0}
#rev .cur{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#0b0906,#1c150c 60%,#2a2012);display:none}#rev .cur.a{right:0;border-left:3px solid #C9A45A}#rev .cur.b{left:0;border-right:3px solid #C9A45A;background:linear-gradient(270deg,#0b0906,#1c150c 60%,#2a2012)}
#rev .in{position:relative;opacity:0}#rev.st-curtain .cur{display:block}#rev.st-curtain .dark{display:none}
/* the ribbon: a band across the screen, cut in its middle; the two halves fall away */
#rev .rib{position:absolute;top:50%;height:150px;margin-top:-75px;width:50.2%;background:linear-gradient(180deg,#C9A45A,#8E6626 12%,var(--accent) 12%,color-mix(in srgb,var(--accent) 70%,#000) 88%,#8E6626 88%,#C9A45A);box-shadow:0 30px 60px rgba(0,0,0,.5);display:none}#rev .rib.a{right:0;transform-origin:100% 50%}#rev .rib.b{left:0;transform-origin:0 50%}
#rev .knot{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F3E2B8,#C9A45A 45%,#8E6626);box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 10px rgba(255,255,255,.14);display:none}
#rev.st-ribbon .rib,#rev.st-ribbon .knot{display:block}

#rev .rays{position:absolute;left:50%;top:50%;width:240vmax;height:240vmax;margin:-120vmax;background:repeating-conic-gradient(from 0deg,rgba(228,204,151,.5) 0 4deg,transparent 4deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);opacity:0;display:none}#rev.st-rays .rays{display:block}
#rev .pl{position:absolute;inset:0;display:none}#rev.st-pulse .pl,#rev.st-dust .pl{display:block}#rev .pl i{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px;border-radius:50%;border:3px solid #E4CC97;box-shadow:0 0 60px rgba(228,204,151,.6);opacity:0}
#rev .pl u{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#F3E2B8;box-shadow:0 0 14px 3px rgba(228,204,151,.8);opacity:0}
@keyframes ribA{0%{transform:none}100%{transform:translate(70%,130%) rotate(24deg);opacity:0}}@keyframes ribB{0%{transform:none}100%{transform:translate(-70%,130%) rotate(-24deg);opacity:0}}@keyframes knot{0%{transform:none;opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes raysIn{0%{opacity:0;transform:rotate(0) scale(.2)}100%{opacity:.9;transform:rotate(60deg) scale(1)}}@keyframes raysOn{0%{opacity:.9;transform:rotate(60deg)}12%{opacity:.26}100%{opacity:.2;transform:rotate(420deg)}}
@keyframes beat{0%{opacity:.95;transform:scale(.15)}100%{opacity:0;transform:scale(4.2)}}@keyframes dustIn{0%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}25%{opacity:1}100%{opacity:1;transform:translate(0,0) scale(1.6)}}
/* behind the scenes of text: a quiet life in the organisation's own colours */
#amb{position:absolute;inset:0;overflow:hidden;pointer-events:none}#amb i{position:absolute;display:block}
.am-glow #amb i:nth-child(1){width:70%;height:90%;left:-15%;top:-25%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 16%,transparent),transparent);animation:glA 26s ease-in-out infinite alternate}
.am-glow #amb i:nth-child(2){width:70%;height:90%;right:-20%;bottom:-30%;background:radial-gradient(closest-side,color-mix(in srgb,var(--gold) 22%,transparent),transparent);animation:glB 32s ease-in-out infinite alternate}
.am-lines #amb i:nth-child(1){inset:-50%;background:repeating-linear-gradient(60deg,transparent 0 118px,color-mix(in srgb,var(--gold) 26%,transparent) 118px 119px),repeating-linear-gradient(-60deg,transparent 0 118px,color-mix(in srgb,var(--gold) 18%,transparent) 118px 119px);animation:lnA 60s linear infinite}
.am-dust #amb u{position:absolute;bottom:-20px;width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:0;animation:dsA linear infinite}
@keyframes glA{to{transform:translate(28%,22%)}}@keyframes glB{to{transform:translate(-26%,-18%)}}@keyframes lnA{to{transform:translate(236px,0)}}@keyframes dsA{0%{opacity:0;transform:none}12%{opacity:.5}100%{opacity:0;transform:translateY(calc(var(--H) * -1.1))}}
/* how a title or a name arrives */
.w{display:inline-block;opacity:0;animation:wIn .7s cubic-bezier(.2,.7,.2,1) both}@keyframes wIn{from{opacity:0;transform:translateY(.5em)}to{opacity:1;transform:none}}
.ti-rise .sc.on .big,.ti-rise .sc.on .nm,.ti-rise .sc.on .hon,.ti-rise .sc.on .sub,.ti-rise .sc.on .rule,.ti-rise .sc.on>div>.lg{animation:tiR 1s cubic-bezier(.2,.7,.2,1) both}.ti-rise .sc.on .hon,.ti-rise .sc.on>div>.lg{animation-delay:.15s}.ti-rise .sc.on .big,.ti-rise .sc.on .nm{animation-delay:.35s}.ti-rise .sc.on .rule{animation-delay:.6s}.ti-rise .sc.on .sub{animation-delay:.75s}
@keyframes tiR{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:none}}
@keyframes cd{0%{opacity:0;transform:scale(1.5)}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:scale(.82)}}
@keyframes ring{0%{opacity:0;transform:scale(.15)}25%{opacity:.9}100%{opacity:1;transform:scale(2.3)}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}@keyframes gone{to{opacity:0}}
@keyframes rin{0%{opacity:0;transform:scale(.84);filter:blur(14px)}100%{opacity:1;transform:none;filter:none}}
@keyframes curA{to{transform:translateX(101%)}}@keyframes curB{to{transform:translateX(-101%)}}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:9}#black.on{opacity:1}
/* the operator has not turned the screens on: nothing of the event is drawn at all */
body.dark #st{visibility:hidden}
#ident{position:fixed;inset:0;z-index:15;display:none;place-items:center;background:#0E1114;color:#F6F2E8;text-align:center;font-family:Kufi}#ident.on{display:grid}#ident small{display:block;font:600 3.2vmin Plex;color:#B88A3D;letter-spacing:.1em}#ident b{display:block;font:900 11vmin/1.3 Kufi;color:#E8D9BD;margin:1vmin 0}#ident span{font:400 3.4vmin Plex;color:#A9B2B4;direction:ltr;display:inline-block}
#go{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(7,31,27,.92);color:#F6F1E6;font:700 30px Kufi;cursor:pointer;text-align:center;padding:20px}
#qr canvas{width:min(420px,calc(var(--W)*.5));height:auto;aspect-ratio:1;background:#fff;padding:22px;border-radius:24px}
/* before the day of the event: the device takes its files and waits */
#prep{position:fixed;inset:0;background:#0E1114;color:#F6F2E8;display:grid;place-items:center;text-align:center;font-family:Kufi;padding:24px}#prep h1{font:900 clamp(22px,4vw,44px) Kufi;color:#E8D9BD}#prep p{font:400 clamp(15px,2vw,22px) Plex;color:#A9B2B4;margin-top:12px}
#prep .bar{width:min(520px,80vw);height:8px;border-radius:4px;background:#2A3A3F;margin:26px auto 0;overflow:hidden}#prep .bar i{display:block;height:100%;width:0;background:#B88A3D;transition:width .4s}#prep .ok{color:#6FE0A6}
</style></head><body class="dark">
<div id="st"><div id="amb"><i></i><i></i></div><div class="frame"></div>
  <section class="sc" id="idle"><div><img class="lg"><div class="big"></div><div class="sub"></div></div></section>

<div id="ident"><div><small></small><b></b><span></span></div></div>

<script src="../vendor/qrcode.js"></script>
<script type="module">
