<!doctype html>
<!-- The big screen (and the side screens with ?side) of any event: draws the scene of the current cue from the event document. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الشاشة</title><link rel="stylesheet" href="../app.css">
<style>
html,body{height:100%;overflow:hidden;background:#000}
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Kufi;transition:background 1.2s}
.sc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}.sc.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.frame{position:absolute;inset:34px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);pointer-events:none;z-index:3}
video,.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.sl{object-fit:cover;background:var(--bg);opacity:0;transition:opacity .9s}.sl.on{opacity:1}
.lg{max-height:300px;max-width:760px}.lg.s{max-height:150px;max-width:420px}
.hon{font:400 34px Plex;color:var(--gold);margin-top:44px}.nm{font:900 96px/1.3 Kufi;color:var(--accent);margin-top:8px}
.big{font:900 110px/1.4 Kufi;color:var(--accent);max-width:1500px}.sub{font:400 38px Plex;color:var(--gold);margin-top:18px}
.rule{width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:40px auto 0}
#arm{background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)}#arm i{display:block;width:260px;height:260px;border-radius:50%;border:1px solid rgba(228,204,151,.55);box-shadow:0 0 120px rgba(228,204,151,.4),inset 0 0 70px rgba(228,204,151,.2);animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:9}#black.on{opacity:1}
#go{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(7,31,27,.92);color:#F6F1E6;font:700 30px Kufi;cursor:pointer}
#qr canvas{width:420px;height:420px;background:#fff;padding:22px;border-radius:24px}
</style></head><body>
<div id="st"><div class="frame"></div>
  <section class="sc" id="idle"><div><img class="lg"><div class="big" style="font-size:72px;margin-top:40px"></div><div class="sub"></div></div></section>
  <section class="sc" id="title"><div><div class="big"></div><div class="rule"></div><div class="sub"></div></div></section>
  <section class="sc" id="card"><div><img class="lg s"><div class="hon"></div><div class="nm"></div><div class="rule"></div></div></section>
  <section class="sc" id="vid"><video playsinline preload="auto"></video></section>
  <section class="sc" id="slides"><img class="sl"><img class="sl"></section>
  <section class="sc" id="arm"><i></i></section>
  <section class="sc" id="qr"><div><canvas width="600" height="600"></canvas><div class="sub" style="color:var(--accent);font-family:Kufi;font-weight:700"></div></div></section>
  <div id="black"></div></div>
<div id="go">اضغط لتشغيل الشاشة</div>
<script src="../vendor/qrcode.js"></script>
<script type="module">
import { connect, paint, $, cueOf, slidesOf } from './run.js'; import * as store from './store.js';
const link = await connect(), D = link.doc, st = $('#st'), v = $('#vid video');
const fit = () => { st.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; }; addEventListener('resize', fit); fit();
$('#go').onclick = () => { $('#go').remove(); v.muted = false; v.play().catch(() => {}); document.documentElement.requestFullscreen?.().catch(() => {}); };
const show = id => document.querySelectorAll('.sc').forEach(s => s.classList.toggle('on', s.id === id));
const M = c => (c && c.media ? D.media[c.media] : null), SIDE = new URLSearchParams(location.search).has('side');
let cur = null, slideEl = 0, lastSlide = '';
async function slide(m, n) { const u = link.base + m.src + 's-' + n + '.jpg'; if (u === lastSlide) return; lastSlide = u; const els = document.querySelectorAll('.sl'); slideEl ^= 1; els[slideEl].src = await store.url(u); els[slideEl].onload = () => { els[slideEl].classList.add('on'); els[slideEl ^ 1].classList.remove('on'); }; }
function logoScene(I, big, sub) { $('#idle img').src = I.logo; $('#idle img').style.display = I.logo ? '' : 'none'; $('#idle .big').textContent = big || ''; $('#idle .sub').textContent = sub || ''; show('idle'); }
function apply(s) {
  const c = cueOf(D, s.cue), I = paint(link, s), m = M(c), P = c.person ? D.people[c.person] : null; $('#black').classList.toggle('on', !!s.black);
  const isVideo = m && m.kind === 'video' && ['loop', 'video', 'launch'].includes(c.type) && !(SIDE && c.type !== 'launch');
  if (isVideo) { const u = link.base + m.src; if (v.dataset.src !== u) { v.dataset.src = u; store.url(u).then(o => { if (v.dataset.src === u) v.src = o; }); } v.loop = c.type === 'loop'; show('vid'); }
  else { if (!v.paused) v.pause();
    if (c.type === 'title') { $('#title .big').textContent = c.text || c.title; $('#title .sub').textContent = P ? [P.honorific, P.name].filter(Boolean).join(' · ') : ''; show('title'); }
    else if (c.type === 'speaker' && !(m && s.slide > 0 && !SIDE)) { $('#card img').src = I.logo; $('#card img').style.display = I.logo ? '' : 'none'; $('#card .hon').textContent = P?.honorific || ''; $('#card .nm').textContent = P?.name || c.title; show('card'); }
    else if ((c.type === 'speaker' || c.type === 'slides') && m && !SIDE) { slide(m, Math.max(1, s.slide || 1)); show('slides'); }
    else if (c.type === 'arm') show('arm');
    else if (c.type === 'qr' || c.type === 'web') { const cv = $('#qr canvas'); if (cv.dataset.u !== c.url) { cv.dataset.u = c.url; try { const q = qrcode(0, 'M'); q.addData(c.url); q.make(); const n = q.getModuleCount(), g = cv.getContext('2d'), z = 600 / n; g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 600); g.fillStyle = '#14211E'; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(x * z, y * z, z + .5, z + .5); } catch {} } $('#qr .sub').textContent = c.text || c.title; show('qr'); }
    else logoScene(I, c.type === 'exit' ? '' : (c.type === 'logo' || SIDE ? '' : D.name), c.type === 'loop' ? D.date : ''); }
  cur = { s, c, isVideo, m };
}
// a video follows the server clock: the same frame on every screen, held while paused, held on its last frame at the end
setInterval(() => { if (!cur || !cur.isVideo || !v.src) return; const { s, c, m } = cur; let t = ((s.paused || link.now()) - s.cueAt) / 1000; if (c.type === 'launch' && s.launchedAt) t = ((s.paused || link.now()) - s.launchedAt) / 1000;
  const L = v.duration || m.length || 0; if (v.loop && L) t %= L; if (L && t >= L - .05) { if (c.type === 'launch') { v.pause(); logoScene(paint(link, s), '', ''); return; } v.pause(); if (Math.abs(v.currentTime - (L - .05)) > .3) v.currentTime = L - .05; return; }
  if ($('#vid').classList.contains('on') === false && c.type === 'launch') show('vid');
  if (s.paused) { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - t) > .15) v.currentTime = Math.max(0, t); return; }
  if (Math.abs(v.currentTime - t) > .45) v.currentTime = Math.max(0, t); if (v.paused) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); }, 250);
link.on(apply);
// the presenter's clicker is plugged into this computer
addEventListener('keydown', e => { if (!cur || !slidesOf(D, cur.s.cue)) return; const go = d => link.online ? link.send({ type: 'step', d }) : link.local({ type: 'step', d }); if (['PageDown', 'ArrowLeft', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); go(1); } if (['PageUp', 'ArrowRight', 'ArrowUp'].includes(e.key)) { e.preventDefault(); go(-1); } });
// this computer keeps every file of the event (videos, slides, logos) and tells the operator how far it is
if (!SIDE) { const files = []; for (const m of Object.values(D.media || {})) { if (m.kind === 'slides') for (let i = 1; i <= (m.count || 0); i++) files.push(link.base + m.src + 's-' + i + '.jpg'); else files.push(link.base + m.src); }
  for (const k of ['before', 'after']) { const I = D.identity[k]; if (I && I.logo) files.push(link.base + I.logo); }
  const tell = st => { const v = Object.values(st), done = v.filter(x => x.done).length, bad = v.filter(x => x.err).length, cur = v.find(x => !x.done && x.pct); link.raw({ report: { total: v.length, done, bad, pct: cur ? cur.pct : 0 } }); };
  let t = 0; store.keep(files, st => { if (Date.now() - t > 700 || Object.values(st).every(x => x.done || x.err)) { t = Date.now(); tell(st); } }).then(tell); }
// network down: N next, P previous, K pause, B black, L launch from this keyboard
addEventListener('keydown', e => { if (link.online) return; const k = e.key.toLowerCase(), c = { n: { type: 'next' }, p: { type: 'prev' }, b: { type: 'black', on: !link.state.black }, l: { type: 'launch' }, k: { type: link.state.paused ? 'resume' : 'pause' } }[k]; if (c) link.local(c); });
window.stageReady = true;
</script></body></html>
