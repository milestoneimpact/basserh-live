<!doctype html>
<!-- A screen of the hall, of any size and either way up. Three kinds from the same page:
     the big screen (follows every cue), a side screen (?side: names and titles, never the slides or the videos),
     and a fixed logo screen (?logo: the logo alone, whatever the cue; it joins the others at the launch only).
     ?mute: inside the studio's preview (no sound, no click to start, not counted among the hall's devices). -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الشاشة</title><link rel="stylesheet" href="../app.css">
<style>
html,body{height:100%;overflow:hidden;background:#000}
/* the canvas takes the shape of the screen: 1080 on its short side, as long as the screen on the other; --k shrinks the type on narrow ones */
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;--W:1920px;--H:1080px;--k:1;transform-origin:50% 50%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Kufi;transition:background 1.2s}
.sc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s ease,transform 1s ease,clip-path 1s ease,visibility 0s linear 1s}
.sc.on{opacity:1;visibility:visible;z-index:2;transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1),clip-path 1.1s ease}
.tr-rise .sc{transform:translateY(54px)}.tr-zoom .sc{transform:scale(1.08)}.tr-rise .sc.on,.tr-zoom .sc.on{transform:none}
.tr-wipe .sc{clip-path:inset(0 0 0 100%)}.tr-wipe .sc.on{clip-path:inset(0)}
.sc>div{max-width:calc(var(--W) - 180px)}#rev>div{max-width:none}#rev .in{max-width:calc(var(--W) - 180px)}
.frame{position:absolute;inset:34px;border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);pointer-events:none;z-index:3}
video,.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}.sl{background:var(--bg);opacity:0;transition:opacity .5s}.sl.on{opacity:1}
.lg{max-height:300px;max-width:min(760px,calc(var(--W)*.62))}.lg.s{max-height:150px;max-width:min(420px,calc(var(--W)*.4))}
.only .lg{max-height:calc(var(--H)*.42);max-width:calc(var(--W)*.64)}
.hon{font:400 calc(34px*var(--k)) Plex;color:var(--gold);margin-top:44px}.nm{font:900 calc(96px*var(--k))/1.3 Kufi;color:var(--accent);margin-top:8px;text-wrap:balance}
.big{font:900 calc(110px*var(--k))/1.4 Kufi;color:var(--accent);text-wrap:balance}.sub{font:400 calc(38px*var(--k)) Plex;color:var(--gold);margin-top:18px}
#idle .big{font-size:calc(72px*var(--k));margin-top:40px}#idle .big:empty,#rev .big:empty,.sub:empty{display:none}
.rule{width:220px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:40px auto 0}
#arm{background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)}#arm i{display:block;width:260px;height:260px;border-radius:50%;border:1px solid rgba(228,204,151,.55);box-shadow:0 0 120px rgba(228,204,151,.4),inset 0 0 70px rgba(228,204,151,.2);animation:pulse 3.2s ease-in-out infinite;margin:0 auto}
#hands{display:flex;gap:26px;justify-content:center;margin-top:70px}#hands b{width:30px;height:30px;border-radius:50%;border:2px solid rgba(228,204,151,.7);transition:background .3s,box-shadow .3s}#hands b.on{background:#E4CC97;box-shadow:0 0 34px #E4CC97}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
/* a launch the screen draws itself: every part is an animation placed on the server's clock by its delay, so all screens move as one */
#rev .dark{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)}
#rev .cd{position:absolute;inset:0;display:grid;place-items:center}#rev .cd b{grid-area:1/1;font:900 calc(520px*var(--k))/1 Kufi;color:#E4CC97;text-shadow:0 0 90px rgba(228,204,151,.55);opacity:0}
#rev .ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px;border-radius:50%;border:2px solid #E4CC97;box-shadow:0 0 160px 40px rgba(228,204,151,.5),inset 0 0 90px rgba(228,204,151,.45);opacity:0}
#rev .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff,#F3E2B8 40%,rgba(243,226,184,0) 75%);opacity:0}
#rev .cur{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(90deg,#0b0906,#1c150c 60%,#2a2012);display:none}#rev .cur.a{right:0;border-left:3px solid #C9A45A}#rev .cur.b{left:0;border-right:3px solid #C9A45A;background:linear-gradient(270deg,#0b0906,#1c150c 60%,#2a2012)}
#rev .in{position:relative;opacity:0}#rev.st-curtain .cur{display:block}#rev.st-curtain .dark{display:none}
@keyframes cd{0%{opacity:0;transform:scale(1.5)}14%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:scale(.82)}}
@keyframes ring{0%{opacity:0;transform:scale(.15)}25%{opacity:.9}100%{opacity:1;transform:scale(2.3)}}
@keyframes flash{0%{opacity:0}18%{opacity:1}100%{opacity:0}}@keyframes gone{to{opacity:0}}
@keyframes rin{0%{opacity:0;transform:scale(.84);filter:blur(14px)}100%{opacity:1;transform:none;filter:none}}
@keyframes curA{to{transform:translateX(101%)}}@keyframes curB{to{transform:translateX(-101%)}}
#black{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;z-index:9}#black.on{opacity:1}
#go{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(7,31,27,.92);color:#F6F1E6;font:700 30px Kufi;cursor:pointer;text-align:center;padding:20px}
#qr canvas{width:min(420px,calc(var(--W)*.5));height:auto;aspect-ratio:1;background:#fff;padding:22px;border-radius:24px}
/* before the day of the event: the device takes its files and waits */
#prep{position:fixed;inset:0;background:#0E1114;color:#F6F2E8;display:grid;place-items:center;text-align:center;font-family:Kufi;padding:24px}#prep h1{font:900 clamp(22px,4vw,44px) Kufi;color:#E8D9BD}#prep p{font:400 clamp(15px,2vw,22px) Plex;color:#A9B2B4;margin-top:12px}
#prep .bar{width:min(520px,80vw);height:8px;border-radius:4px;background:#2A3A3F;margin:26px auto 0;overflow:hidden}#prep .bar i{display:block;height:100%;width:0;background:#B88A3D;transition:width .4s}#prep .ok{color:#6FE0A6}
</style></head><body>
<div id="st"><div class="frame"></div>
  <section class="sc" id="idle"><div><img class="lg"><div class="big"></div><div class="sub"></div></div></section>
  <section class="sc" id="title"><div><div class="big"></div><div class="rule"></div><div class="sub"></div></div></section>
  <section class="sc" id="card"><div><img class="lg s"><div class="hon"></div><div class="nm"></div><div class="rule"></div></div></section>
  <section class="sc" id="vid"><video playsinline preload="auto"></video></section>
  <section class="sc" id="slides"><img class="sl"><img class="sl"></section>
  <section class="sc" id="arm"><div><i></i><div id="hands"></div></div></section>
  <section class="sc" id="rev"><div class="dark"></div><div class="in"><img class="lg"><div class="big"></div><div class="rule"></div></div><div class="cur a"></div><div class="cur b"></div><div class="ring"></div><div class="cd"></div><div class="flash"></div></section>
  <section class="sc" id="qr"><div><canvas width="600" height="600"></canvas><div class="sub" style="color:var(--accent);font-family:Kufi;font-weight:700"></div></div></section>
  <div id="black"></div></div>
<div id="go">اضغط لتشغيل الشاشة</div>
<script src="../vendor/qrcode.js"></script>
<script type="module">
import { connect, paint, $, cueOf, slidesOf, launchTimes, launchStyle, handsOf, deviceId, filesOf } from './run.js'; import * as store from './store.js';
const Q = new URLSearchParams(location.search), SIDE = Q.has('side'), LOGO = Q.has('logo'), MUTE = Q.has('mute'), kind = LOGO ? 'logo' : SIDE ? 'side' : 'main';
// opened before the day of the event: the device saves the files of the event and says so; it opens by itself when the day comes
window.prepScreen = async cfg => { const P = cfg.prep; document.body.innerHTML = `<div id="prep"><div><h1></h1><p id="pw">يحفظ هذا الجهاز ملفات اللقاء…</p><div class="bar"><i></i></div><p id="pn"></p><p style="font-size:14px;margin-top:26px"></p></div></div>`; $('#prep h1').textContent = P.name; $('#prep p:last-child').textContent = cfg.error;
  const show = st => { const v = Object.values(st), done = v.filter(x => x.done).length, bad = v.filter(x => x.err).length, cur = v.find(x => !x.done && x.pct); $('#prep .bar i').style.width = (v.length ? (done + (cur ? cur.pct / 100 : 0)) / v.length * 100 : 100) + '%'; $('#pn').textContent = `${done} من ${v.length}${bad ? ' · تعذّر ' + bad : ''}`;
    if (done === v.length) { $('#pw').textContent = 'هذا الجهاز جاهز: كل ملفات اللقاء محفوظة عليه'; $('#pw').className = 'ok'; } else if (done + bad === v.length) $('#pw').textContent = 'تعذّر حفظ بعض الملفات. أعد فتح الصفحة والشبكة متصلة.'; };
  store.keep(P.files, show).then(show); setInterval(async () => { try { if ((await fetch(`/api/run/${Q.get('e')}/config`)).ok) location.reload(); } catch {} }, 60000); };
const link = await connect(), D = link.doc, st = $('#st'), v = $('#vid video');
document.body.classList.add('tr-' + (D.transition || 'fade')); if (LOGO) st.classList.add('only');
const fit = () => { const a = innerWidth / innerHeight, port = a < 1, W = port ? 1080 : Math.round(1080 * a), H = port ? Math.round(1080 / a) : 1080;
  st.style.width = W + 'px'; st.style.height = H + 'px'; st.style.setProperty('--W', W + 'px'); st.style.setProperty('--H', H + 'px'); st.style.setProperty('--k', port ? .66 : Math.max(.7, Math.min(1, W / 1920)).toFixed(3));
  st.style.transform = `translate(-50%,-50%) scale(${innerWidth / W})`; st.classList.toggle('port', port); }; addEventListener('resize', () => { fit(); tellRep(); }); fit();
if (MUTE) { $('#go').remove(); v.muted = true; } else $('#go').onclick = () => { $('#go').remove(); audio(); v.muted = false; v.play().catch(() => {}); document.documentElement.requestFullscreen?.().catch(() => {}); };
// the sound of a drawn launch, made here (no file, no melody): a soft tick for each second of the countdown, a rising breath, a deep strike at the reveal.
// Only the big screen sounds, and only once someone has clicked it (the browser's rule), so the hall hears one source.
let AC = null; const audio = () => { if (MUTE || kind !== 'main') return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch {} return AC; };
function sound(style, T, el) { const a = audio(); if (!a || el > T.reveal + .5) return; const t0 = a.currentTime - el, out = a.createGain(); out.gain.value = .8; out.connect(a.destination);
  const tone = (at, f0, f1, dur, vol, type = 'sine') => { if (t0 + at + dur < a.currentTime) return; const o = a.createOscillator(), g = a.createGain(), st = Math.max(a.currentTime, t0 + at); o.type = type; o.frequency.setValueAtTime(f0, st); o.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, st + Math.min(.03, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur); o.connect(g).connect(out); o.start(st); o.stop(t0 + at + dur + .05); };
  const noise = (at, dur, vol, f0, f1) => { if (t0 + at + dur < a.currentTime) return; const n = a.createBufferSource(), b = a.createBuffer(1, a.sampleRate * dur, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; n.buffer = b; const f = a.createBiquadFilter(), g = a.createGain(), st = Math.max(a.currentTime, t0 + at); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur); g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(vol, t0 + at + dur * .85); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur); n.connect(f).connect(g).connect(out); n.start(st); n.stop(t0 + at + dur + .05); };
  if (style === 'countdown') for (let i = 0; i < T.count; i++) tone(i, 190, 70, .28, .5);
  noise(Math.max(0, T.reveal - 2.6), Math.min(2.6, T.reveal), .35, 300, 5000); tone(T.reveal, 95, 38, 2.4, .9); noise(T.reveal, 1.8, .22, 6000, 900); }
const show = id => document.querySelectorAll('.sc').forEach(s => s.classList.toggle('on', s.id === id));
const M = c => (c && c.media ? D.media[c.media] : null);
let cur = null, slideEl = 0, lastSlide = '';
async function slide(m, n) { const u = link.base + m.src + 's-' + n + '.jpg'; if (u === lastSlide) return; lastSlide = u; const els = document.querySelectorAll('.sl'); slideEl ^= 1; const el = els[slideEl], other = els[slideEl ^ 1]; el.onload = () => { if (lastSlide !== u) return; el.classList.add('on'); other.classList.remove('on'); }; el.src = await store.url(u);
  const r = slidesOf(D, cur?.s.cue || ''); if (r && n < r.max) store.url(link.base + m.src + 's-' + (n + 1) + '.jpg').then(x => { new Image().src = x; }); }   // the next slide is decoded ahead
function logoScene(I, big, sub) { $('#idle img').src = I.logo; $('#idle img').style.display = I.logo ? '' : 'none'; $('#idle .big').textContent = big || ''; $('#idle .sub').textContent = sub || ''; show('idle'); }
// the launch drawn by the screen: countdown, light or curtain, then the logo (the new one when the event has one) and the revealed name
function reveal(c, s) { const R = $('#rev'), style = launchStyle(c), T = launchTimes(D), key = s.launchedAt + style; show('rev'); if (R.dataset.k === key) return; R.dataset.k = key; R.className = 'sc on st-' + style;
  const I = D.identity.after || D.identity.before, el = (link.now() - s.launchedAt) / 1000, img = $('#rev img'); img.style.display = I.logo ? '' : 'none'; if (I.logo) store.url(link.base + I.logo).then(u => { img.src = u; }); $('#rev .big').textContent = c.text || (I.logo ? '' : D.name);
  sound(style, T, el);
  const run = (e, name, at, dur, ease = 'ease') => { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = `${name} ${dur}s ${ease} ${(at - el).toFixed(3)}s both`; };
  const cd = $('#rev .cd'); cd.innerHTML = ''; if (style === 'countdown') for (let i = 0; i < T.count; i++) { const b = document.createElement('b'); b.textContent = (T.count - i).toLocaleString('ar-EG'); cd.appendChild(b); run(b, 'cd', i, 1); }
  const ring = $('#rev .ring'); ring.style.animation = 'none'; void ring.offsetWidth; if (style === 'light') ring.style.animation = `ring 3s cubic-bezier(.5,0,.9,.4) ${(-el).toFixed(3)}s both, gone .5s ease ${(3 - el).toFixed(3)}s forwards`;
  if (style === 'curtain') { run($('#rev .cur.a'), 'curA', 1, 3, 'cubic-bezier(.6,0,.2,1)'); run($('#rev .cur.b'), 'curB', 1, 3, 'cubic-bezier(.6,0,.2,1)'); run($('#rev .in'), 'rin', 1.2, 2.6); $('#rev .flash').style.animation = 'none'; }
  else { run($('#rev .dark'), 'gone', T.reveal, 1.2); run($('#rev .flash'), 'flash', T.reveal - .12, 1.6); run($('#rev .in'), 'rin', T.reveal + .1, 2.4, 'cubic-bezier(.2,.7,.2,1)'); } }
function apply(s, info) {
  const c = cueOf(D, s.cue), I = paint(link, s), m = M(c), P = c.person ? D.people[c.person] : null; $('#black').classList.toggle('on', !!s.black);
  { const need = handsOf(D), h = $('#hands'); if (need > 1) { const held = (info && info.hands && info.hands.held) || 0; if (h.children.length !== need) h.innerHTML = '<b></b>'.repeat(need); [...h.children].forEach((b, i) => b.classList.toggle('on', i < held)); } else h.innerHTML = ''; }
  const drawn = c.type === 'launch' && launchStyle(c) !== 'video' && s.launchedAt;
  const isVideo = !drawn && m && m.kind === 'video' && ['loop', 'video', 'launch'].includes(c.type) && !((SIDE || LOGO) && c.type !== 'launch');
  if (isVideo) { const u = link.base + m.src; if (v.dataset.src !== u) { v.dataset.src = u; store.url(u).then(o => { if (v.dataset.src === u) v.src = o; }); } v.loop = c.type === 'loop'; show('vid'); }
  else { if (!v.paused) v.pause();
    if (drawn) reveal(c, s);
    else if (LOGO) logoScene(I, '', '');   // the fixed screen: the logo, whatever the others show
    else if (c.type === 'title') { $('#title .big').textContent = c.text || c.title; $('#title .sub').textContent = P ? [P.honorific, P.name].filter(Boolean).join(' · ') : ''; show('title'); }
    else if (c.type === 'speaker' && !(m && s.slide > 0 && !SIDE)) { $('#card img').src = I.logo; $('#card img').style.display = I.logo ? '' : 'none'; $('#card .hon').textContent = P?.honorific || ''; $('#card .nm').textContent = P?.name || c.title; show('card'); }
    else if ((c.type === 'speaker' || c.type === 'slides') && m && !SIDE) { cur = { s, c, m }; slide(m, Math.max(1, s.slide || 1)); show('slides'); }
    else if (c.type === 'arm') show('arm');
    else if (c.type === 'qr' || c.type === 'web') { const cv = $('#qr canvas'); if (cv.dataset.u !== c.url) { cv.dataset.u = c.url; try { const q = qrcode(0, 'M'); q.addData(c.url); q.make(); const n = q.getModuleCount(), g = cv.getContext('2d'), z = 600 / n; g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 600); g.fillStyle = '#14211E'; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(x * z, y * z, z + .5, z + .5); } catch {} } $('#qr .sub').textContent = c.text || c.title; show('qr'); }
    else logoScene(I, c.type === 'exit' ? '' : (c.type === 'logo' || SIDE ? '' : c.type === 'launch' ? (c.text || '') : D.name), c.type === 'loop' ? D.date : ''); }
  if (!drawn) $('#rev').dataset.k = '';
  cur = { s, c, isVideo, m }; if (info && info.online && !wasOn) tellRep(); wasOn = !!(info && info.online);
}
// a video follows the server clock: the same frame on every screen, held while paused, held on its last frame at the end
setInterval(() => { if (!cur || !cur.isVideo || !v.src) return; const { s, c, m } = cur; let t = ((s.paused || link.now()) - s.cueAt) / 1000; if (c.type === 'launch' && s.launchedAt) t = ((s.paused || link.now()) - s.launchedAt) / 1000;
  const L = v.duration || m.length || 0; if (v.loop && L) t %= L; if (L && t >= L - .05) { if (c.type === 'launch') { v.pause(); logoScene(paint(link, s), c.text || '', ''); return; } v.pause(); if (Math.abs(v.currentTime - (L - .05)) > .3) v.currentTime = L - .05; return; }
  if ($('#vid').classList.contains('on') === false && c.type === 'launch') show('vid');
  if (s.paused) { if (!v.paused) v.pause(); if (Math.abs(v.currentTime - t) > .15) v.currentTime = Math.max(0, t); return; }
  if (Math.abs(v.currentTime - t) > .45) v.currentTime = Math.max(0, t); if (v.paused) v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); }, 250);
// this device keeps the files it will show (the big screen all of them, a side or logo screen the logos and the launch video),
// and tells the operator who it is and how far it is
let rep = null, wasOn = false; function tellRep() { if (rep && !MUTE) link.raw({ report: { id: deviceId(), kind, w: innerWidth, h: innerHeight, ...rep } }); }
link.on(apply);
// the presenter's clicker is plugged into this computer
addEventListener('keydown', e => { if (!cur || !slidesOf(D, cur.s.cue)) return; const go = d => link.online ? link.send({ type: 'step', d }) : link.local({ type: 'step', d }); if (['PageDown', 'ArrowLeft', 'ArrowDown', ' '].includes(e.key)) { e.preventDefault(); go(1); } if (['PageUp', 'ArrowRight', 'ArrowUp'].includes(e.key)) { e.preventDefault(); go(-1); } });
if (!MUTE) { const files = filesOf(D, link.base, kind === 'main'); let t = 0;
  const tell = st => { const x = Object.values(st), done = x.filter(f => f.done).length, bad = x.filter(f => f.err).length, now = x.find(f => !f.done && f.pct); rep = { total: x.length, done, bad, pct: now ? now.pct : 0 }; tellRep(); };
  store.keep(files, st => { if (Date.now() - t > 700 || Object.values(st).every(x => x.done || x.err)) { t = Date.now(); tell(st); } }).then(tell); }
// network down: N next, P previous, K pause, B black, L launch from this keyboard
addEventListener('keydown', e => { if (link.online) return; const k = e.key.toLowerCase(), c = { n: { type: 'next' }, p: { type: 'prev' }, b: { type: 'black', on: !link.state.black }, l: { type: 'launch' }, k: { type: link.state.paused ? 'resume' : 'pause' } }[k]; if (c) link.local(c); });
window.stageReady = true;
</script></body></html>
