<!doctype html>
<!-- The visitor's phone, from a station's QR code: the same file, from the page the visitor left, in the organisation's identity.
     Opens on the event's day only; reads that station's file and nothing else. The key travels after the # (never sent to a server log). -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>القراءة</title><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="../fonts/brand.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:var(--bg,#F6F1E6);color:var(--ink,#14211E);font-family:var(--ft,Kufi)}
header{position:absolute;inset:0 0 auto 0;height:58px;display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);background:var(--bg)}
header img{height:36px;max-width:90px;object-fit:contain}header div{min-width:0}header b{display:block;font:700 16px var(--ft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header small{font:400 12px Plex;opacity:.65}
#room{position:absolute;inset:58px 0 70px 0;background:color-mix(in srgb,var(--ink) 6%,var(--bg))}
footer{position:absolute;inset:auto 0 0 0;height:70px;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;padding:0 10px calc(env(safe-area-inset-bottom)) 10px;background:var(--bg);border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
footer button{height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--bg);display:grid;place-items:center}footer button[disabled]{opacity:.25}footer svg{width:26px;height:26px}
.c{text-align:center;font:600 15px Plex}.c i{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin-top:6px;overflow:hidden}.c i b{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;font:600 18px/1.8 Plex;color:#777}
#lk{position:absolute;inset:58px 0 auto 0;height:44px;display:none;gap:8px;align-items:center;padding:0 12px;overflow-x:auto;background:var(--bg);border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}#lk.on{display:flex}#lk a{flex:none;font:600 13px Plex;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:20px;padding:6px 14px;text-decoration:none;white-space:nowrap}
body.lk #room{top:102px}
#fb{position:absolute;inset:auto 12px 82px 12px;display:none;background:var(--bg);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);border-radius:18px;padding:14px 16px;box-shadow:0 12px 30px rgba(0,0,0,.18);text-align:center}#fb.on{display:block}#fb b{font:700 16px var(--ft);display:block;margin-bottom:10px}#fb div{display:flex;gap:8px}#fb button{flex:1;height:44px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:transparent;color:var(--ink);font:600 14px Plex}#fb button:first-child{background:var(--accent);color:var(--bg);border-color:var(--accent)}#fb small{display:block;margin-top:8px;opacity:.6;font:400 12px Plex}
</style></head><body>
<header><img id="lg" alt="" hidden><div><b id="tt"></b><small id="st"></small></div></header>
<nav id="lk"></nav><div id="room"></div><div id="fb"><b>هل أفادك المعرض؟</b><div><button data-a="yes">نعم</button><button data-a="some">إلى حد ما</button><button data-a="no">لا</button></div><small data-x>لاحقًا</small></div>
<footer><button id="bR"></button><div class="c"><span id="pc"></span><i><b id="pg"></b></i></div><button id="bL"></button></footer>
<div id="msg">يفتح الملف…</div>
<script type="module">
import { Book, openPdf, imageDoc } from './book.js';
const $ = s => document.querySelector(s), H = new URLSearchParams(location.hash.slice(1)), e = H.get('e'), s = H.get('s'), k = H.get('k'), m = H.get('m') === 'd' ? 'd' : 'l', start = +H.get('p') || 1;
const api = `/api/read/${e}/${s}/${m}/${k}`; history.replaceState(null, '', location.pathname + '#' + new URLSearchParams({ e, s, m, k }));   // the page number is not kept in the address: a reload opens where the reader is (below)
/* a phone set to another language reads the page's own words in English (the organisation's file and names stay as they are) */
const EN = !/^ar\b/i.test(navigator.language || 'ar'), W = EN ? { open: 'Opening…', fail: 'The file could not be opened', page: (n, N) => `Page ${n} of ${N}`, q: 'Was the exhibition useful to you?', yes: 'Yes', some: 'Somewhat', no: 'No', later: 'Later', thanks: 'Thank you' } : { open: 'يفتح الملف…', fail: 'تعذّر فتح الملف', page: (n, N) => `صفحة ${n.toLocaleString('ar')} من ${N.toLocaleString('ar')}`, q: 'هل أفادك المعرض؟', yes: 'نعم', some: 'إلى حد ما', no: 'لا', later: 'لاحقًا', thanks: 'شكرًا لك' };
if (EN) { document.documentElement.lang = 'en'; $('#msg').textContent = W.open; $('#fb b').textContent = W.q; for (const k of ['yes', 'some', 'no']) $(`#fb [data-a="${k}"]`).textContent = W[k]; $('#fb [data-x]').textContent = W.later; }
const fail = t => { $('#msg').textContent = t; $('#msg').style.display = 'grid'; };
try { const r = await fetch(api), d = await r.json(); if (!r.ok) throw new Error(d.error || 'تعذّر فتح الملف');
  const R = document.documentElement.style, c = d.colors || {}; for (const [n, v] of Object.entries({ bg: c.bg || '#F6F1E6', ink: c.ink || '#14211E', accent: c.accent || '#0F5A4E', gold: c.gold || '#C2A063' })) R.setProperty('--' + n, v); R.setProperty('--ft', d.font || 'Kufi');
  if (d.logo) { $('#lg').src = api + '/logo'; $('#lg').hidden = false; } $('#tt').textContent = d.title || d.station; $('#st').textContent = [d.station, d.name].filter(Boolean).join(' · '); document.title = d.title || d.station;
  /* the organisation's buttons (its site, a call, a message), and one question, asked once on this phone after a little reading */
  if ((d.links || []).length) { $('#lk').innerHTML = d.links.map(l => `<a target="_blank" rel="noopener"></a>`).join(''); [...$('#lk').children].forEach((x, i) => { x.textContent = (EN && d.links[i].en) || d.links[i].label; x.href = d.links[i].url; }); $('#lk').classList.add('on'); document.body.classList.add('lk'); }
  const FK = 'fb:' + e; if (d.ask && !localStorage.getItem(FK)) { setTimeout(() => $('#fb').classList.add('on'), 25000);
    $('#fb').onclick = async ev => { const b = ev.target.closest('[data-a]'); if (ev.target.closest('[data-x]')) { $('#fb').classList.remove('on'); return; } if (!b) return; try { localStorage.setItem(FK, b.dataset.a); } catch {}
      $('#fb').innerHTML = `<b>${W.thanks}</b>`; setTimeout(() => $('#fb').classList.remove('on'), 1600); fetch(api + '/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ a: b.dataset.a, id: Math.random().toString(36).slice(2, 12) + Date.now().toString(36) }) }).catch(() => {}); }; }
  const K = 'rd:' + e + ':' + s + ':' + d.media, rtl = d.dir !== 'ltr', arrow = l => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${l ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
  $('#bL').innerHTML = arrow(true); $('#bR').innerHTML = arrow(false);
  // what was read on the phone, sent once when the visitor leaves (pages and time on each; nothing about the visitor)
  const vs = { id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36), station: s, media: d.media, start: Date.now(), pages: {}, zooms: {}, li: 0, lo: 0, qr: 0, pg: 0, pgAt: Date.now() }; let sent = false;   // page 0: the file still opening, not counted
  const bye = () => { if (sent) return; sent = true; const t = Date.now(); vs.pages[vs.pg] = (vs.pages[vs.pg] || 0) + (t - vs.pgAt); const { pg, pgAt, ...x } = vs; x.ms = t - x.start; try { navigator.sendBeacon(api + '/session', new Blob([JSON.stringify(x)], { type: 'application/json' })); } catch {} };
  addEventListener('pagehide', bye); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') bye(); });
  const book = Book($('#room'), { dir: d.dir, zoom: true, links: true, pad: 8, padY: 8, onLink: l => { vs[l.page ? 'li' : 'lo']++; if (l.url) window.open(l.url, '_blank', 'noopener'); },
    onPage: (n, N) => { const t = Date.now(); vs.pages[vs.pg] = (vs.pages[vs.pg] || 0) + (t - vs.pgAt); vs.pg = n; vs.pgAt = t; $('#pc').textContent = W.page(n, N); $('#pg').style.width = n / N * 100 + '%'; (rtl ? $('#bR') : $('#bL')).disabled = n <= 1; (rtl ? $('#bL') : $('#bR')).disabled = n >= N; try { sessionStorage.setItem(K, n); } catch {} } });
  $('#bL').onclick = () => (rtl ? book.fwd() : book.back()); $('#bR').onclick = () => (rtl ? book.back() : book.fwd());
  // a film plays here with its own controls; a gallery is read like a book, picture by picture
  if (d.kind === 'video') { $('#room').innerHTML = `<video controls playsinline preload="metadata" style="width:100%;height:100%;background:#000"></video>`; $('#room video').src = api + '/file'; document.querySelector('footer').style.display = 'none'; $('#room').style.bottom = '0'; $('#msg').style.display = 'none'; } else {
  const pdf = d.kind === 'slides' ? imageDoc(d.pages, n => api + '/file?n=' + n) : await openPdf(api + '/file', { whole: true }); let p = start; if (!H.has('p')) try { p = +sessionStorage.getItem(K) || 1; } catch {}
  await book.load(pdf, p); $('#msg').style.display = 'none';
  }
} catch (x) { fail(EN ? W.fail : x.message || W.fail); }
</script></body></html>
