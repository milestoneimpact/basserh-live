<!doctype html>
<!-- A station: one touch screen of an exhibition, with its own PDF the visitors browse by hand. Locked: no address bar, no menu,
     no way back or out from the page; it goes back to its first page when nobody touches it. The board (stations.html) gives it
     another file whenever the organisation wants, and sees the page its visitor is on.
     ?s=<station>: which station, for a member trying it from the studio (a station's own link carries it). -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>المحطة</title>
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="../app.css"><link rel="stylesheet" href="../fonts/brand.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:var(--bg,#F6F1E6);color:var(--ink,#14211E);font-family:var(--ft,Kufi)}
#room{position:absolute;inset:0 0 104px 0;background:color-mix(in srgb,var(--ink) 7%,var(--bg))}
.bh{position:absolute;inset:0;transition:opacity .6s ease}.bh.out{opacity:0;pointer-events:none}
#bar{direction:ltr;position:absolute;inset:auto 0 0 0;height:104px;display:grid;grid-template-columns:120px 1fr auto 120px;gap:18px;align-items:center;padding:0 22px;background:var(--bg);border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.ar{width:104px;height:76px;border-radius:20px;border:0;background:var(--accent);color:var(--bg);font:900 40px/1 sans-serif;display:grid;place-items:center;cursor:pointer;transition:transform .12s,opacity .2s}.ar:active{transform:scale(.94)}.ar[disabled]{opacity:.22}
.ar svg{width:40px;height:40px}
.mid,.tools{direction:rtl}.mid{display:flex;align-items:center;gap:22px;min-width:0}.mid img{height:58px;max-width:170px;object-fit:contain}
.cnt{font:700 24px var(--ft);white-space:nowrap}.cnt small{display:block;font:400 16px Plex;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.prog{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;min-width:60px}.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s}
.tools{display:flex;gap:12px}.tb{height:76px;padding:0 24px;border-radius:20px;border:2px solid color-mix(in srgb,var(--ink) 18%,transparent);background:transparent;color:var(--ink);font:700 20px var(--ft);display:flex;align-items:center;gap:10px;cursor:pointer}.tb:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}.tb svg{width:30px;height:30px}
.tb[hidden]{display:none}
/* the pages, small: a strip that rises from the bar */
#th{position:absolute;inset:auto 0 104px 0;height:230px;background:color-mix(in srgb,var(--bg) 94%,var(--ink));border-top:1px solid color-mix(in srgb,var(--ink) 14%,transparent);transform:translateY(100%);opacity:0;transition:transform .35s cubic-bezier(.2,.75,.25,1),opacity .25s;pointer-events:none;z-index:5}
#th.on{transform:none;opacity:1;pointer-events:auto}#thl{display:flex;gap:16px;overflow-x:auto;height:100%;padding:18px 22px;box-sizing:border-box;touch-action:pan-x;scrollbar-width:none}#thl::-webkit-scrollbar{display:none}
.t{flex:0 0 auto;display:grid;justify-items:center;gap:6px;cursor:pointer}.t span{height:160px;min-width:100px;display:grid;place-items:center;border-radius:8px;border:3px solid transparent;overflow:hidden}.t.on span{border-color:var(--gold)}.t b{font:600 15px Plex}
.t canvas{display:block;max-height:154px}
/* what a screen shows to nobody: the invitation to touch */
#att{position:absolute;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:radial-gradient(70% 60% at 50% 45%,color-mix(in srgb,var(--bg) 80%,transparent),color-mix(in srgb,var(--bg) 96%,var(--ink)));backdrop-filter:blur(6px);transition:opacity .6s,visibility 0s linear .6s}
#att.off{opacity:0;visibility:hidden}#att img{max-height:22vh;max-width:50vw}#att h1{font:900 clamp(34px,5.2vw,84px)/1.35 var(--ft);color:var(--accent);margin:4vh 6vw 0;text-wrap:balance}#att p{font:400 clamp(18px,2vw,30px) Plex;color:var(--gold);margin:1.4vh 0 0}
#att .tap{margin:6vh auto 0;width:clamp(110px,10vw,170px);aspect-ratio:1;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;animation:beat 2.2s ease-in-out infinite}#att .tap svg{width:48%;height:48%;color:var(--accent)}
#att .go{font:700 clamp(20px,2.2vw,34px) var(--ft);margin-top:2.6vh;color:var(--ink)}
@keyframes beat{0%,100%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--gold) 50%,transparent)}50%{transform:scale(1.07);box-shadow:0 0 0 26px transparent}}
#dark{position:absolute;inset:0;z-index:30;background:var(--bg);display:none;place-items:center}#dark.on{display:grid}#dark img{max-height:30vh;max-width:55vw}
#qrm{position:absolute;inset:0;z-index:40;background:rgba(10,12,14,.66);display:none;place-items:center}#qrm.on{display:grid}
#qrm .box{background:var(--bg);border-radius:28px;padding:38px 44px;text-align:center;max-width:min(620px,88vw);box-shadow:0 30px 90px rgba(0,0,0,.4)}#qrm h2{font:900 32px var(--ft);color:var(--accent);margin:0 0 6px}#qrm p{font:400 20px/1.7 Plex;margin:0 0 20px}
#qrm canvas{width:300px;height:300px;border-radius:16px}#qrm button{margin-top:24px;height:64px;padding:0 44px;border-radius:18px;border:0;background:var(--accent);color:var(--bg);font:700 22px var(--ft);cursor:pointer}
#id{position:absolute;inset:0;z-index:50;display:none;place-items:center;background:rgba(10,12,14,.82);color:#fff;text-align:center}#id.on{display:grid}#id b{display:block;font:900 120px Kufi;color:#E4CC97}#id span{font:600 40px Plex}
#net{position:absolute;top:14px;left:14px;z-index:60;font:600 13px Plex;background:#4A1D16;color:#FFB4A4;border-radius:999px;padding:4px 12px;display:none}#net.on{display:block}
#load{position:absolute;inset:0;display:grid;place-items:center;font:600 22px Plex;opacity:.6}
#prep{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#0E1114;color:#E9E2D0;font-family:Plex}#prep h1{font:900 40px Kufi;color:#E4CC97}#prep .bar{width:420px;height:6px;border-radius:3px;background:#2A3A3F;margin:20px auto}#prep .bar i{display:block;height:100%;width:0;background:#E4CC97;border-radius:3px}
.film{position:absolute;inset:0;display:grid;place-items:center;background:#000}.film video{max-width:100%;max-height:100%}.fp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:120px;height:120px;padding:0 34px;border-radius:60px;border:0;background:rgba(0,0,0,.55);color:#fff;font:700 24px var(--ft);display:none;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(4px)}.fp.on{display:flex}.fp svg{width:44px;height:44px}
/* the waiting screen with a picture or a film of the organisation: the words sit on a band at the bottom */
#aM{position:absolute;inset:0;z-index:0;background:#000;display:none}#att.media #aM{display:block}#aM img,#aM video{position:absolute;inset:0;width:100%;height:100%;max-width:none!important;max-height:none!important;object-fit:cover;transition:opacity 1.2s}#aM img.off{opacity:0}
#att>div:last-child{position:relative;z-index:1}#att.media{place-items:end center;background:none;backdrop-filter:none}#att.media>div:last-child{width:100%;padding:3vh 4vw 5vh;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 92%,transparent) 35%)}#att.media img#aL{max-height:10vh}#att.media h1{margin-top:1vh}#att.media .tap{margin-top:2vh;width:clamp(80px,7vw,120px)}
/* searching the book: a panel with its own keyboard (the screen has none) */
#sp{position:absolute;inset:0 0 104px 0;z-index:8;background:rgba(10,12,14,.45);display:none;justify-content:flex-end}#sp.on{display:flex}
#sp .sb{width:min(720px,100%);height:100%;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;box-shadow:0 0 60px rgba(0,0,0,.35)}
#sp .sh{display:flex;gap:12px;padding:18px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}#sq{flex:1;height:64px;border-radius:16px;border:2px solid color-mix(in srgb,var(--ink) 20%,transparent);background:#fff;color:#111;font:600 24px var(--ft);padding:0 18px}
#sp .sh button{height:64px;padding:0 22px;border-radius:16px;border:0;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);font:700 18px var(--ft)}
#sr{overflow-y:auto;padding:10px 18px;touch-action:pan-y}#sr button{display:block;width:100%;text-align:start;border:0;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent);background:none;padding:14px 6px;color:var(--ink);font:400 18px/1.7 Plex}#sr button b{display:block;font:700 19px var(--ft);color:var(--accent)}#sr p{font:400 18px Plex;opacity:.65;text-align:center;margin-top:30px}
#kb{display:grid;gap:8px;padding:14px;background:color-mix(in srgb,var(--ink) 6%,var(--bg))}#kb div{display:flex;gap:6px;justify-content:center}#kb button{flex:1;max-width:64px;height:58px;border-radius:12px;border:0;background:#fff;color:#111;font:600 22px var(--ft);box-shadow:0 2px 0 rgba(0,0,0,.12)}#kb button.w{max-width:none;flex:3}#kb button.m{max-width:110px;flex:1.6;font-size:16px;background:color-mix(in srgb,var(--ink) 12%,#fff)}
#msgb{position:absolute;top:22px;left:50%;transform:translateX(-50%);z-index:45;max-width:min(1100px,90vw);padding:16px 32px;border-radius:18px;background:var(--accent);color:var(--bg);font:700 clamp(20px,2vw,30px)/1.6 var(--ft);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.3);display:none}#msgb.on{display:block;animation:msgIn .5s ease}
@keyframes msgIn{from{opacity:0;transform:translate(-50%,-14px)}}
/* the waiting screen, richer: a light that moves slowly behind, the logo that breathes with a gleam passing over it, the event's name */
#att{overflow:hidden}#att .aglow{position:absolute;inset:-20%;z-index:0;background:radial-gradient(40% 40% at 30% 30%,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),radial-gradient(45% 45% at 70% 70%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 70%);animation:drift 18s ease-in-out infinite alternate;pointer-events:none}#att.media .aglow{display:none}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}
.alw{position:relative;display:inline-block;animation:breathe 6s ease-in-out infinite;-webkit-mask:linear-gradient(#000 0 0)}.alw:after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);animation:gleam 7s ease-in-out infinite;pointer-events:none;mix-blend-mode:soft-light}
@keyframes breathe{50%{transform:scale(1.035)}}@keyframes gleam{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.aev{font:600 clamp(16px,1.5vw,24px) var(--ft);color:var(--ink);opacity:.7;margin-top:2vh;letter-spacing:.02em}#att h1{animation:rise 1.2s ease both}#att:not(.off) .tap{animation:beat 2.2s ease-in-out infinite,rise 1.2s ease .3s both}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#att *,#att .aglow{animation:none!important}}
@media (max-width:900px){#bar{grid-template-columns:84px 1fr auto 84px;gap:10px;padding:0 10px}.ar{width:78px}.tb{padding:0 14px;font-size:16px}.tb span{display:none}.mid img{display:none}}
</style></head><body>
<div id="room"><div id="load">يفتح الملف…</div></div>
<div id="th"><div id="thl"></div></div>
<div id="bar"><button class="ar" id="bF" aria-label="الصفحة التالية"></button>
  <div class="mid"><img id="lg" alt=""><div class="cnt"><span id="pc"></span><small id="ttl"></small></div><div class="prog"><i id="pg"></i></div></div>
  <div class="tools"><button class="tb" id="bT"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="7" rx="1"/><rect x="14" y="4" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>الصفحات</span></button>
  <button class="tb" id="bS" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span>بحث</span></button>

  <button class="tb" id="bQ" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg><span>أكمل على جوالك</span></button></div>
  <button class="ar" id="bB" aria-label="الصفحة السابقة"></button></div>

<div id="dark"><img id="dL" alt=""></div>

<div id="id"><div><b id="iN"></b><span id="iP"></span></div></div><div id="msgb"></div><div id="net">لا اتصال · يعمل من نسخته المحفوظة</div>

<script type="module">
import { connect, $, paint, deviceId } from './run.js';
import { keep, url } from './store.js';
import { Book, openPdf, draw, qr, imageDoc, search } from './book.js';
import { stationOf, stationCfg } from '../engine/config.js';
import { stationMedia } from '../engine/state.js';

// ----- the lock: the visitor stays on this page. No menu, no selection, no keys that leave, no way back; full screen at the first touch.
// (the device itself is locked too: Chrome in kiosk mode, screen pinning on Android, Guided Access on an iPad; see the studio's links page)
const stop = e => { e.preventDefault(); e.stopPropagation(); return false; };
for (const t of ['contextmenu', 'selectstart', 'dragstart', 'gesturestart', 'gesturechange', 'dblclick']) addEventListener(t, stop, { capture: true, passive: false });
addEventListener('keydown', e => { const k = e.key; if (e.ctrlKey || e.metaKey || e.altKey || /^F\d+$/.test(k) || k === 'Escape' || k === 'Tab' || k === 'BrowserBack' || k === 'ContextMenu') return stop(e); }, { capture: true });
addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#thl, #sr')) e.preventDefault(); }, { passive: false });
history.pushState({ k: 1 }, '', location.href); addEventListener('popstate', () => history.pushState({ k: 1 }, '', location.href));
addEventListener('beforeunload', e => { if (window.leaving) return; e.preventDefault(); e.returnValue = ''; });
const full = () => { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); };
addEventListener('pointerdown', full, { capture: true });
let wl = null; const wake = async () => { try { if (!wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } } catch {} }; document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && wake()); wake();
// links never open on this screen: a window.open or a page change from anything inside is refused
window.open = () => null;

// before the day: the screen keeps its file and waits
window.prepScreen = async cfg => { const P = cfg.prep; document.body.style.touchAction = 'none'; document.body.innerHTML = `<div id="prep"><div><h1></h1><p id="ps"></p><div class="bar"><i></i></div><p id="pw">يحفظ هذا الجهاز ملف المحطة…</p><p id="pe" style="font-size:14px;margin-top:26px;opacity:.7"></p></div></div>`;
  $('#prep h1').textContent = P.name; $('#ps').textContent = P.station || ''; $('#pe').textContent = cfg.error;
  const st = await keep(P.files, s => { const v = Object.values(s), pct = v.reduce((a, x) => a + (x.done ? 100 : x.pct || 0), 0) / Math.max(1, v.length); $('#prep .bar i').style.width = pct + '%'; });
  $('#pw').textContent = Object.values(st).every(x => x.done) ? 'الملف محفوظ على هذا الجهاز. تفتح المحطة وحدها في موعد التفعيل.' : 'لم يكتمل الحفظ. يعيد المحاولة تلقائياً.';
  setTimeout(() => { window.leaving = true; location.reload(); }, 5 * 60000); };

// the page keeps a copy of itself and of what it loaded (sw.js), so a screen restarted with no network opens its station again
if (navigator.serviceWorker) navigator.serviceWorker.register('/sw.js').then(() => navigator.serviceWorker.ready).then(() => setTimeout(() => { const seen = new Set([location.href]); for (const e of performance.getEntriesByType('resource')) if (e.name.startsWith(location.origin) && !/\/(api|m)\//.test(e.name)) seen.add(e.name.split('#')[0]);
  for (const u of seen) fetch(u, { cache: 'no-store' }).catch(() => {}); }, 4000)).catch(() => {});
try { localStorage.setItem('screen:url', location.pathname + location.search); } catch {}
const link = await connect(), D = link.doc, Q = new URLSearchParams(location.search);
// the hall's one link: the screen asks once which station it is (the operator's choice, kept on this device); #pick asks again
const PK = 'pick:' + Q.get('e'); if (link.role === 'hall' && (location.hash === '#pick' || !stationOf(D, localStorage.getItem(PK)))) { await pick(); }
async function pick() { document.body.insertAdjacentHTML('beforeend', `<div id="pk" style="position:fixed;inset:0;z-index:90;background:#0E1114;color:#E9E2D0;display:grid;place-items:center;text-align:center;font-family:Plex;touch-action:pan-y;overflow:auto"><div style="padding:4vh 4vw"><h1 style="font:900 clamp(28px,3.4vw,48px) Kufi;color:#E4CC97;margin:0">أي محطة هذه الشاشة؟</h1><p style="font-size:20px;color:#B9C2C0">${D.name.replace(/[<>&"]/g, '')} · يُحفظ الاختيار على هذا الجهاز</p><div id="pkL" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,300px));justify-content:center;gap:14px;margin:3vh auto 0;max-width:1400px"></div></div></div>`);
  const L = document.getElementById('pkL'); for (const [i, st] of (D.stations || []).entries()) { const b = document.createElement('button'); b.style.cssText = 'min-height:110px;border-radius:18px;border:2px solid rgba(228,204,151,.35);background:#1F2A2E;color:#fff;font:700 24px Kufi;cursor:pointer;padding:14px'; b.innerHTML = `<span style="display:block;font:600 16px Plex;color:#C9A45A">${i + 1}</span>`; b.append(st.name || st.id); if (st.place) b.insertAdjacentHTML('beforeend', `<small style="display:block;font:400 15px Plex;color:#B9C2C0;margin-top:4px"></small>`), b.lastChild.textContent = st.place; b.dataset.id = st.id; L.appendChild(b); }
  const id = await new Promise(res => L.onclick = e => { const b = e.target.closest('button'); if (b) res(b.dataset.id); }); localStorage.setItem(PK, id); history.replaceState(null, '', location.pathname + location.search); document.getElementById('pk').remove(); }
const sid = link.label || Q.get('s') || (link.role === 'hall' ? localStorage.getItem(PK) : null) || ((D.stations || [])[0] || {}).id, S0 = stationOf(D, sid);
if (!S0) { document.body.innerHTML = '<p style="font:600 22px sans-serif;text-align:center;margin-top:40vh;color:#888">هذه المحطة لم تعد في اللقاء</p>'; throw new Error('station'); }
const S = stationCfg(S0), rtl = S.dir !== 'ltr', me = deviceId(); document.title = S.name || 'المحطة';
const I = paint(link, link.state || {}); for (const im of ['#lg', '#aL', '#dL']) { if (I.logo) url(I.logo).then(u => $(im).src = u); else $(im).style.display = 'none'; }
$('#aP').textContent = S.place || ''; $('#aE').textContent = D.name || '';
// the arrows point the way the book reads: in Arabic «next» is on the left
const arrow = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d === 'l' ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
const left = $('#bF'), right = $('#bB'); left.innerHTML = arrow('l'); right.innerHTML = arrow('r');
const goLeft = () => (rtl ? book && book.fwd() : book && book.back()), goRight = () => (rtl ? book && book.back() : book && book.fwd());
left.onclick = () => { touch(); goLeft(); }; right.onclick = () => { touch(); goRight(); };
if (!S.thumbs) $('#bT').hidden = true;
const readKey = S.qr ? link.read[sid] || null : null; if (readKey) $('#bQ').hidden = false;

let kind = '', book = null, host = null, pdf = null, cur = null, want = null, loading = false, last = 0, attract = false, seenReset = null, err = '', view = { z: 1, x: .5, y: .5 };
const touch = () => { last = Date.now(); if (!sess && book) begin(); if (attract) { attract = false; $('#att').classList.add('off'); waitMedia(false); } report(); };
addEventListener('pointerdown', touch, { capture: true });
// ----- the measure: one session per visitor, from the first touch to the screen's rest. The pages seen and how long on each, the pages
// brought closer, the links followed, the phone code asked for. Kept on this device until the server has it, so a cut network loses nothing
