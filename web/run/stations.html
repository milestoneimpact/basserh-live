<!doctype html>
<!-- The stations' board: every touch screen of the exhibition as its visitor sees it now (the file, the page, how close),
     whether it is connected and when it was last touched; a file given to one station or to all of them in one move,
     a station sent back to its first page or put out. A screen made big follows its station live. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المحطات</title><link rel="icon" href="../brand/icon.png"><link rel="stylesheet" href="../app.css">
<style>

#big header{border:0}#big .scr{aspect-ratio:auto;cursor:zoom-out;margin:0 26px;border-radius:14px}#big .scr canvas{max-width:96%;max-height:96%}#big .ft{display:flex;gap:10px;align-items:center;padding:14px 26px;flex-wrap:wrap}

#alerts{display:none;gap:8px;flex-wrap:wrap;padding:10px 26px;background:#2A1612;border-bottom:1px solid #C2533F}#alerts.on{display:flex}.al{border:1px solid #C2533F;background:#4A1D16;color:#FFD2C6;border-radius:999px;padding:6px 14px;font:600 13px Plex;cursor:pointer}.al.idle{background:#3A3016;border-color:#C9A45A;color:#F0DDB0}

  main{grid-template-columns:1fr;padding:12px 14px;gap:12px}.row .b,.row select{padding:10px;font-size:14px}#big .ft{padding:10px 14px}#big .ft .b,#big .ft select{flex:1 1 45%}#big .scr{margin:0 10px}#alerts{padding:8px 14px}#pm .box{padding:18px}}

#rmS{font:700 17px Plex;margin:10px 0 14px}#rmT table{width:100%;border-collapse:collapse;font:600 13px Plex}#rmT th{color:#A9B2B4;text-align:start;padding:6px;border-bottom:1px solid rgba(228,204,151,.2)}#rmT td{padding:7px 6px;border-bottom:1px solid rgba(228,204,151,.08);vertical-align:top}.ok{color:#8FE3B5}.no{color:#FFB4A4}.wa{color:#F0DDB0}
.ctl input[type=range]{height:30px}

</style></head><body>
<header><div class="wm">بصيرة<i></i><span>BASSERH</span></div><h1 id="ttl">لوحة المحطات</h1><span class="pill" id="mode"></span><span class="pill" id="cnt"></span><span class="pill" id="vis" title="الجلسات المكتملة: من أول لمسة حتى عودة الشاشة إلى البداية"></span><span class="sp"></span>

<div id="big"><header><h1 id="bN"></h1><span class="pill" id="bS"></span><span class="sp"></span><button class="b" id="bX">إغلاق</button></header><div class="scr" id="bScr"><div class="pv"></div><span class="zm"></span><div class="dk">المحطة مطفأة</div></div>
  <div class="ft"><select id="bF"></select><button class="b" id="bH">إلى البداية</button><button class="b" id="bD"></button><button class="b" id="bR">إعادة تشغيل الشاشة</button><button class="b" id="bO">فتح المحطة للتجربة</button><span class="sp"></span><span id="bI" style="font:600 14px Plex;color:#A9B2B4"></span></div></div>

<div id="toast"></div>
<script type="module">
import { connect, $, esc } from './run.js';
import { openPdf, draw, imageDoc } from './book.js';
import { Library, thumbOf } from '../library.js';
import { stationCfg, STATION_KINDS, scheduled } from '../engine/config.js';
import { stationMedia } from '../engine/state.js';
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2400); };
const link = await connect(), D = link.doc, Q = new URLSearchParams(location.search), ST = (D.stations || []).map(stationCfg);
if (link.role !== 'console') { document.body.innerHTML = '<p style="text-align:center;margin-top:40vh">هذه اللوحة للمشغّل</p>'; throw new Error('role'); }
$('#ttl').textContent = D.name; document.title = 'لوحة المحطات · ' + D.name; $('#mode').textContent = link.draft ? 'تجربة على المسودة' : 'العرض الحي'; $('#mode').className = 'pill' + (link.draft ? ' reh' : '');
const KINDW = { pdf: 'صفحة', slides: 'صورة', video: 'فيديو' }, PDFS = Object.entries(D.media || {}).filter(([, m]) => STATION_KINDS.includes(m.kind)), opts = sel => `<option value="">ملفها الأصلي</option>` + PDFS.map(([k, m]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(m.name)}${m.kind === 'video' ? ' · فيديو' : m.count ? ' · ' + m.count + ' ' + KINDW[m.kind] : ''}</option>`).join('');
$('#allF').innerHTML = PDFS.map(([k, m]) => `<option value="${k}">${esc(m.name)}</option>`).join('');
// the files, opened once each; a page drawn once for a size
const docs = new Map(), pdfOf = k => { const m = D.media[k]; if (!docs.has(k)) docs.set(k, m.kind === 'slides' ? Promise.resolve(imageDoc(m.count || 0, n => link.base + m.src + 's-' + n + '.jpg')) : openPdf(link.base + m.src)); return docs.get(k); };
// a film is drawn as a card with its name (the board does not play twenty films)
const filmCv = (k, w, h) => { const c = document.createElement('canvas'), r = Math.min(2, devicePixelRatio || 1); c.width = w * r; c.height = Math.round(w * 9 / 16) * r; c.style.width = w + 'px'; const g = c.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, c.width, c.height); g.fillStyle = '#E4CC97'; g.beginPath(); const cx = c.width / 2, cy = c.height / 2 - 14 * r; g.moveTo(cx - 18 * r, cy - 22 * r); g.lineTo(cx + 24 * r, cy); g.lineTo(cx - 18 * r, cy + 22 * r); g.fill(); g.font = `600 ${15 * r}px Plex, sans-serif`; g.textAlign = 'center'; g.fillText(D.media[k].name || 'فيديو', cx, cy + 50 * r); return c; };
const drawn = new Map(); async function pageCv(k, n, w, h) { if (D.media[k] && D.media[k].kind === 'video') return filmCv(k, w, h); const key = `${k}:${n}:${w}`; if (!drawn.has(key)) { if (drawn.size > 80) drawn.clear(); drawn.set(key, pdfOf(k).then(p => draw(p, Math.min(n, p.numPages), w, h)).then(r => r.cv)); } const src = await drawn.get(key), c = document.createElement('canvas'); c.width = src.width; c.height = src.height; c.style.cssText = src.style.cssText; c.getContext('2d').drawImage(src, 0, 0); return c; }

$('#grid').innerHTML = ST.map((s, i) => `<div class="card" data-s="${s.id}"><div class="scr"><div class="pv"><div class="em">ينتظر الاتصال</div></div><span class="tag"><i></i><em></em></span><span class="zm"></span><div class="dk">المحطة مطفأة</div></div>
  <div class="inf"><div class="nm"><b>${i + 1}. ${esc(s.name)}</b><span class="pg"></span></div><div class="sub"><span>${esc(s.place || '')}</span><span class="tc"></span></div><div class="sub vs"><span></span><span></span></div><div class="sub sc" style="color:var(--gold2)"></div>
  <div class="row"><select data-f>${opts('')}</select><button class="b" data-h>البداية</button><button class="b" data-d></button><button class="b" data-lp title="اختيار ملف هذه الشاشة من المكتبة، بالصور والمعاينة">من المكتبة</button><button class="b" data-z>تكبير</button><button class="b" data-r title="تعيد الشاشة تحميل نفسها، كما لو أُطفئت وشُغّلت">إعادة تشغيل</button></div></div></div>`).join('') || '<p style="grid-column:1/-1;text-align:center;color:#A9B2B4">لا محطات في هذا اللقاء. أضيفوها من الاستوديو.</p>';

let S = link.state || {}, HALL = {}, big = null; const send = c => link.send(c);
// the station as the board knows it: the latest report of a screen of that station, and the room's state for it
const now = () => Date.now(), ago = t => { const s = Math.round((now() - t) / 1000); return s < 10 ? 'الآن' : s < 60 ? `منذ ${s} ث` : s < 3600 ? `منذ ${Math.round(s / 60)} د` : `منذ ${Math.round(s / 3600)} س`; };
// a station that leaves the room is not forgotten: its last report stays, so the board can say since when it is gone
const SEEN = new Map(), liveOf = sid => Object.values(HALL || {}).filter(r => r.kind === 'station' && r.sid === sid).sort((a, b) => b.at - a.at)[0] || null;
const repOf = sid => { const r = liveOf(sid); if (r) { SEEN.set(sid, r); return r; } return SEEN.get(sid) || null; };
const info = sid => { const r = repOf(sid), x = (S.st || {})[sid] || {}, media = stationMedia(D, S, sid), on = !!liveOf(sid) && now() - r.at < 40000;
  return { r, on, dark: !!x.dark, media, shown: r && r.media ? r.media : media, page: r ? r.page : 0, pages: r ? r.pages : 0, z: r ? r.z : 1, x: r ? r.x : .5, y: r ? r.y : .5, busy: on && r.touch && now() - r.touch < 15000 && !r.idle, idle: r ? r.idle : false, touch: r ? r.touch : 0 }; };
const status = i => !i.on ? ['off', 'غير متصلة'] : i.dark ? ['off', 'مطفأة'] : i.busy ? ['on', 'زائر يتصفح الآن'] : i.idle ? ['idle', 'تنتظر زائراً'] : ['idle', 'متصلة'];
// one picture of a station: its page, brought as close as the visitor brought it
const last = new WeakMap(); async function paintScr(el, i, w, h) { const pv = el.querySelector('.pv'), key = `${i.shown}:${i.page}:${w}`;
  el.querySelector('.dk').classList.toggle('on', i.dark); const zm = el.querySelector('.zm'); zm.classList.toggle('on', i.z > 1.05); zm.textContent = 'مكبّرة ×' + i.z.toFixed(1);
  pv.style.transformOrigin = `${i.x * 100}% ${i.y * 100}%`; pv.style.transform = i.z > 1.05 ? `scale(${i.z})` : '';
  if (!i.shown || !D.media[i.shown]) { if (last.get(el) !== 'none') { last.set(el, 'none'); pv.innerHTML = `<div class="em">${i.on ? 'لا ملف' : 'ينتظر الاتصال'}</div>`; } return; }
  if (last.get(el) === key) return; last.set(el, key); try { const c = await pageCv(i.shown, Math.max(1, i.page || 1), w, h); if (last.get(el) === key) pv.replaceChildren(c); } catch { pv.innerHTML = '<div class="em">تعذّر فتح الملف</div>'; } }
// the next turn of a station's schedule (in the event's time zone)
const nextOf = sid => { const st = ST.find(x => x.id === sid), list = (st && st.schedule || []).filter(x => /^\d\d:\d\d$/.test(x.at)).sort((a, b) => a.at < b.at ? -1 : 1); if (!list.length) return null; const t = new Intl.DateTimeFormat('en-GB', { timeZone: D.tz || undefined, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date()); return list.find(x => x.at > t) || list[0]; };
// ----- the alerts: a station cut off for twenty seconds, a station whose file failed, a station nobody has touched for an hour while the hall is open
const AL = new Map(); let alertOn = false; try { alertOn = localStorage.getItem('alerts:' + Q.get('e')) === '1'; } catch {}
function alerts() { const now2 = Date.now(), list = [];
  for (const st of ST) { const i = info(st.id), r = i.r; let a = null;
    if (r && !i.on && now2 - r.at > 20000) a = { k: 'off', t: `${st.name}: انقطعت ${ago(r.at)}` };
    else if (r && i.on && r.err) a = { k: 'err', t: `${st.name}: ${r.err}` };
    else if (r && i.on && !i.dark && (now2 - (i.touch || r.at)) > 36e5 && !link.draft) a = { k: 'idle', t: `${st.name}: لم يلمسها أحد منذ ساعة` };
    const was = AL.get(st.id); if (a) { list.push({ ...a, sid: st.id }); if (!was || was.k !== a.k) { AL.set(st.id, a); if (alertOn && a.k !== 'idle') ping(a.t); } } else AL.delete(st.id); }
  $('#alerts').innerHTML = list.map(a => `<button class="al ${a.k}" data-s="${a.sid}">${esc(a.t)}</button>`).join(''); $('#alerts').classList.toggle('on', list.length > 0);
  document.querySelectorAll('#alerts .al').forEach(b => b.onclick = () => document.querySelector(`.card[data-s="${b.dataset.s}"] [data-z]`)?.click()); }
function ping(t) { try { if (window.Notification && Notification.permission === 'granted') new Notification('لوحة المحطات', { body: t, tag: 'st-' + t }); } catch {}
  try { const ac = ping.ac || (ping.ac = new (window.AudioContext || window.webkitAudioContext)()), o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.0001, ac.currentTime); g.gain.exponentialRampToValueAtTime(.2, ac.currentTime + .02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .5); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .55); } catch {} }
$('#alOn').textContent = alertOn ? 'التنبيهات مفعّلة' : 'تفعيل التنبيهات'; $('#alOn').classList.toggle('on', alertOn);
$('#alOn').onclick = async () => { alertOn = !alertOn; try { localStorage.setItem('alerts:' + Q.get('e'), alertOn ? '1' : '0'); } catch {} if (alertOn && window.Notification && Notification.permission === 'default') { try { await Notification.requestPermission(); } catch {} } $('#alOn').textContent = alertOn ? 'التنبيهات مفعّلة' : 'تفعيل التنبيهات'; $('#alOn').classList.toggle('on', alertOn); if (alertOn) ping('ستصلك التنبيهات هنا'); };
function paint() { alerts(); volPaint(); msgPaint(); if ($('#rm.on')) readiness(); const on = ST.filter(s => info(s.id).on).length; $('#cnt').textContent = `متصلة ${on.toLocaleString('ar')} من ${ST.length.toLocaleString('ar')}`; $('#cnt').className = 'pill ' + (on === ST.length && on ? 'ok' : on ? '' : 'bad');
  for (const card of document.querySelectorAll('.card')) { const sid = card.dataset.s, i = info(sid), [k, t] = status(i), tag = card.querySelector('.tag');
    card.classList.toggle('live', i.busy); tag.className = 'tag ' + k; tag.querySelector('em').textContent = t;
    card.querySelector('.pg').textContent = i.pages ? `صفحة ${i.page.toLocaleString('ar')} من ${i.pages.toLocaleString('ar')}` : '';
    card.querySelector('.tc').textContent = i.touch ? 'آخر لمسة ' + ago(i.touch) : ''; const nx = nextOf(sid), scd = card.querySelector('.sc'); if (scd) scd.textContent = nx ? `الجدولة: ${nx.at} «${(D.media[nx.media] || {}).name || ''}»` : ''; const f = card.querySelector('[data-f]'); if (document.activeElement !== f) f.value = ((S.st || {})[sid] || {}).media || '';
    card.querySelector('[data-d]').textContent = i.dark ? 'تشغيل' : 'إطفاء'; const sc = card.querySelector('.scr'); paintScr(sc, i, Math.round(sc.clientWidth * .94), Math.round(sc.clientHeight * .94)); }
  if (big) { const i = info(big), s = ST.find(x => x.id === big), [, t] = status(i); $('#bS').textContent = t; $('#bI').textContent = (i.pages ? `صفحة ${i.page} من ${i.pages} · ` : '') + (i.touch ? 'آخر لمسة ' + ago(i.touch) : '');
    if (document.activeElement !== $('#bF')) $('#bF').value = ((S.st || {})[big] || {}).media || ''; $('#bD').textContent = i.dark ? 'تشغيل المحطة' : 'إطفاء المحطة'; const sc = $('#bScr'); paintScr(sc, i, Math.round(sc.clientWidth * .96), Math.round(sc.clientHeight * .96)); $('#bN').textContent = s ? s.name + (s.place ? ' · ' + s.place : '') : ''; } }
// the commands
const assign = (sid, media) => { send({ type: 'assign', sid, media: media || null }); const m = D.media[media]; toast(m ? `«${m.name}» إلى المحطة. تنتقل إليه حين يتوقف الزائر عن التصفح` : 'تعود المحطة إلى ملفها الأصلي'); };
document.querySelectorAll('.card').forEach(card => { const sid = card.dataset.s;
  card.querySelector('[data-f]').onchange = e => assign(sid, e.target.value); card.querySelector('[data-h]').onclick = () => { send({ type: 'sreset', sid }); toast('عادت المحطة إلى صفحتها الأولى'); };
  card.querySelector('[data-d]').onclick = () => send({ type: 'sdark', sid, on: !info(sid).dark }); const open = () => { big = sid; $('#big').classList.add('on'); $('#bF').innerHTML = opts(((S.st || {})[sid] || {}).media); last.delete($('#bScr')); paint(); };
  card.querySelector('[data-z]').onclick = open; card.querySelector('.scr').onclick = open; });
$('#bX').onclick = $('#bScr').onclick = () => { big = null; $('#big').classList.remove('on'); }; addEventListener('keydown', e => { if (e.key === 'Escape' && big) $('#bX').click(); });
$('#bF').onchange = e => assign(big, e.target.value); $('#bH').onclick = () => send({ type: 'sreset', sid: big }); $('#bD').onclick = () => send({ type: 'sdark', sid: big, on: !info(big).dark });
$('#bO').onclick = () => window.open(`station.html?e=${Q.get('e')}&s=${big}${link.draft ? '&draft' : ''}`, '_blank');
$('#ident').onclick = () => send({ type: 'ident' }); $('#home').onclick = () => { if (confirm('تعود كل المحطات إلى صفحتها الأولى، ومن يتصفح الآن يبدأ من جديد. متابعة؟')) send({ type: 'sreset' }); };
$('#allGo').onclick = () => { const k = $('#allF').value; if (!k || !confirm(`«${D.media[k].name}» على كل المحطات؟`)) return; send({ type: 'assign', ids: ST.map(s => s.id), media: k }); toast('أُرسل الملف إلى كل المحطات'); };
// the library: a cover dragged onto a screen gives it that file
$('#lib').innerHTML = PDFS.map(([k, m]) => `<div class="cv" draggable="true" data-k="${k}" title="${esc(m.name)}"><div>${thumbOf(m, f => link.base + f) ? `<img src="${thumbOf(m, f => link.base + f)}">` : m.kind === 'video' ? '<b style="font-size:26px;color:#C9A45A">▶</b>' : 'PDF'}</div><small>${esc(m.name)}</small></div>`).join('');
document.querySelectorAll('.cv').forEach(c => c.ondragstart = e => { e.dataTransfer.setData('text/x-media', c.dataset.k); e.dataTransfer.effectAllowed = 'copy'; });
const dropOn = (el, sidOf) => { el.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('text/x-media')) { e.preventDefault(); el.classList.add('hot'); } }); el.addEventListener('dragleave', () => el.classList.remove('hot'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('hot'); const k = e.dataTransfer.getData('text/x-media'); if (k && D.media[k]) assign(sidOf(), k); }); };
document.querySelectorAll('.card').forEach(c => dropOn(c, () => c.dataset.s)); dropOn($('#bScr'), () => big);
// pairing a screen by its code (the published event only)
$('#pmU').textContent = location.host + '/screen'; $('#pmS').innerHTML = ST.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
if (link.draft) $('#pair').style.display = 'none';
$('#pair').onclick = () => { $('#pm').classList.add('on'); $('#pmE').textContent = ''; $('#pmC').value = ''; setTimeout(() => $('#pmC').focus(), 50); }; $('#pmX').onclick = () => $('#pm').classList.remove('on');
$('#pmGo').onclick = async () => { const code = $('#pmC').value.replace(/\D/g, ''); if (code.length !== 6) return $('#pmE').textContent = 'الرمز ستة أرقام كما يظهر على الشاشة';
  const r = await fetch(`/api/run/${Q.get('e')}/pair`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code, station: $('#pmS').value }) }), j = await r.json().catch(() => ({}));
  if (!r.ok) return $('#pmE').textContent = j.error || 'تعذّر الربط'; $('#pm').classList.remove('on'); toast(`رُبطت الشاشة بـ«${j.station}». تفتح محطتها خلال ثوانٍ`); };
$('#pmC').onkeydown = e => { if (e.key === 'Enter') $('#pmGo').click(); };
$('#allBack').onclick = () => { send({ type: 'assign', ids: ST.map(s => s.id), media: null }); toast('عادت كل محطة إلى ملفها الأصلي'); };
// the visitors, counted by the screens (each one sent when the screen goes back to rest)
const mmss = ms => { const t = Math.round(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
async function vis() { try { const v = await (await fetch(`/api/run/${Q.get('e')}/visits?tz=${new Date().getTimezoneOffset()}${link.draft ? '&draft' : ''}`)).json(); if (v.total == null) return;
  $('#vis').textContent = `الزوار ${v.total.toLocaleString('ar')}${v.total ? ' · متوسط ' + mmss(v.ms / v.total) : ''}${v.phone ? ' · على الجوال ' + v.phone.toLocaleString('ar') : ''}`;
  for (const x of v.stations) { const c = document.querySelector(`.card[data-s="${x.station}"] .vs`); if (c) { c.children[0].textContent = x.n ? `${x.n.toLocaleString('ar')} زائر` : 'لا زوار بعد'; c.children[1].textContent = x.n ? 'متوسط ' + mmss(x.ms / x.n) : ''; } } } catch {} }
vis(); setInterval(vis, 20000);
// the library, to choose a screen's file with its pictures and a preview (the board reads the published files; it changes nothing in them)
const LIB = Library({ media: () => D.media || {}, src: f => link.base + f, used: k => ST.filter(x => stationMedia(D, S, x.id) === k).map(x => x.name), stations: () => ST, save() {}, toast, assign() {}, confirm: async () => false, prompt: async () => null });
document.querySelectorAll('.card').forEach(c => { c.querySelector('[data-lp]').onclick = async () => { const sid = c.dataset.s, r = await LIB.pick({ title: `ملف «${(ST.find(x => x.id === sid) || {}).name}» الآن`, current: info(sid).media || '' }); if (r && r.key) assign(sid, r.key); }; });
// ----- the further control: a screen restarted from here, the films' volume, a few words on every screen
document.querySelectorAll('.card').forEach(c => { c.querySelector('[data-r]').onclick = () => { if (confirm('تُعاد تشغيل هذه الشاشة الآن. من يتصفحها يبدأ من جديد. متابعة؟')) { send({ type: 'sreload', sid: c.dataset.s }); toast('أُرسل أمر إعادة التشغيل'); } }; });
$('#bR').onclick = () => { if (big && confirm('تُعاد تشغيل هذه الشاشة الآن. متابعة؟')) { send({ type: 'sreload', sid: big }); toast('أُرسل أمر إعادة التشغيل'); } };
const volNow = () => (S.vol == null ? 1 : S.vol), volPaint = () => { const v = volNow(); if (document.activeElement !== $('#vLvl')) $('#vLvl').value = Math.round(v * 100); $('#vTxt').textContent = Math.round(v * 100) + '%'; $('#vMute').textContent = v ? 'كتم' : 'إرجاع الصوت'; $('#vMute').classList.toggle('on', !v); };
let vT = 0; $('#vLvl').oninput = () => { $('#vTxt').textContent = $('#vLvl').value + '%'; clearTimeout(vT); vT = setTimeout(() => send({ type: 'vol', level: +$('#vLvl').value / 100 }), 250); };
let lastVol = 1; $('#vMute').onclick = () => { const v = volNow(); if (v) { lastVol = v; send({ type: 'vol', level: 0 }); } else send({ type: 'vol', level: lastVol || 1 }); };
$('#mGo').onclick = () => { const t = $('#mTxt').value.trim(); if (!t) return toast('اكتب الرسالة أولاً'); send({ type: 'msg', text: t, minutes: +$('#mMin').value }); toast('ظهرت الرسالة على كل الشاشات'); };
$('#mOff').onclick = () => send({ type: 'msg', text: '' });
const msgPaint = () => { const m = S.msg && link.now() < S.msg.until ? S.msg : null; $('#mNow').textContent = m ? `معروضة حتى ${new Date(m.until).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' })}` : ''; };
// ----- the readiness check before the doors open: every screen, one line each, what is ready and what is missing
const CH = [['on', 'متصلة'], ['open', 'الملف مفتوح'], ['kept', 'محفوظ على الجهاز'], ['ver', 'آخر نسخة'], ['size', 'المقاس'], ['qr', 'رمز الجوال'], ['sched', 'الجدولة']];
function readiness() { const rows = [], now2 = Date.now(); let ready = 0;
  for (const st of ST) { const i = info(st.id), r = liveOf(st.id), c = {};
    c.on = r && i.on ? ['ok', '✓'] : ['no', i.r ? 'انقطعت ' + ago(i.r.at) : 'لم تُفتح بعد'];
    c.open = !r ? ['no', '·'] : r.err ? ['no', r.err] : r.ready ? ['ok', '✓'] : ['no', 'لم يُفتح'];
    c.kept = !r ? ['no', '·'] : r.kept ? ['ok', '✓'] : ['wa', 'يحفظ الآن'];
    c.ver = !r ? ['no', '·'] : r.ver === link.version ? ['ok', '✓'] : ['no', 'نسخة قديمة: أعيدوا تشغيلها'];
    c.size = !r ? ['no', '·'] : Math.min(r.w, r.h) >= 600 ? ['ok', `${r.w}×${r.h}`] : ['wa', `${r.w}×${r.h} صغيرة`];
    c.qr = !st.qr ? ['ok', 'غير مطلوب'] : !r ? ['no', '·'] : r.qr ? ['ok', '✓'] : ['no', 'لا يعمل'];
    const sc = (st.schedule || []).length, nx = nextOf(st.id); c.sched = !sc ? ['ok', 'بلا جدولة'] : ['ok', `${sc} ${sc === 1 ? 'وقت' : 'أوقات'}${nx ? ' · التالي ' + nx.at : ''}`];
    if (i.dark) c.on = ['wa', 'مطفأة من اللوحة'];
    const good = Object.values(c).every(x => x[0] !== 'no'); if (good) ready++; rows.push({ st, c, good }); }
  $('#rmS').innerHTML = ready === ST.length ? `<span class="ok">كل الشاشات جاهزة (${ready.toLocaleString('ar')} من ${ST.length.toLocaleString('ar')})</span>` : `<span class="no">جاهزة ${ready.toLocaleString('ar')} من ${ST.length.toLocaleString('ar')}</span> <span style="color:#A9B2B4;font-weight:400">· ما يحتاج انتباهاً بالأحمر</span>`;
  $('#rmT').innerHTML = `<table><tr><th>المحطة</th>${CH.map(([, t]) => `<th>${t}</th>`).join('')}</tr>${rows.map(x => `<tr><td><b>${esc(x.st.name)}</b><br><small style="color:#A9B2B4">${esc(x.st.place || '')}</small></td>${CH.map(([k]) => `<td class="${x.c[k][0]}">${esc(x.c[k][1])}</td>`).join('')}</tr>`).join('')}</table>`;
  return { ready, rows }; }
$('#rdy').onclick = () => { readiness(); $('#rm').classList.add('on'); }; $('#rmX').onclick = () => $('#rm').classList.remove('on');
$('#rmP').onclick = () => { const w = window.open('', '_blank'); w.document.write(`<html dir="rtl" lang="ar"><head><meta charset="utf-8"><title>فحص الجاهزية · ${esc(D.name)}</title><style>body{font-family:Tahoma,Arial,sans-serif;color:#1F2A2E;margin:24px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{border:1px solid #ddd;padding:5px;text-align:right}.ok{color:#2E6B3A}.no{color:#A8402F;font-weight:700}.wa{color:#8A6A1F}</style></head><body><h2>فحص الجاهزية: ${esc(D.name)}</h2><p>${new Date().toLocaleString('ar')}</p><p>${$('#rmS').textContent}</p>${$('#rmT').innerHTML}</body></html>`); w.document.close(); w.print(); };
link.on((s, inf) => { S = s; if (inf.hall) HALL = inf.hall; paint(); }); setInterval(paint, 5000); addEventListener('resize', () => { document.querySelectorAll('.scr').forEach(e => last.delete(e)); paint(); });
</script></body></html>
