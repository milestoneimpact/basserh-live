<!doctype html>
<!-- The platform owner's page: the organisations that rent the studio, their limits, their activation days, and the link that signs an owner in.
     Opens with the owner key (kept for this tab only). -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بصيرة · إدارة المنصة</title><link rel="icon" href="brand/icon.png"><link rel="stylesheet" href="app.css">
<style>header{background:linear-gradient(120deg,var(--deep),var(--night));color:var(--cream);padding:16px 34px;display:flex;align-items:center;gap:18px;border-bottom:2px solid var(--gold)}main{max-width:1280px;margin:0 auto;padding:30px 34px 80px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.g{display:grid;grid-template-columns:1.3fr 1fr 1.4fr .7fr .7fr auto;gap:12px;align-items:end}
table{width:100%;border-collapse:collapse}th{font:600 13px Plex;color:var(--mute);text-align:right;padding:8px 10px}td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}td b{font-family:Kufi}
.num{font:600 20px Corm;color:var(--gold);direction:ltr}code{direction:ltr;display:inline-block;font-size:13px;word-break:break-all}.okb{padding:12px 16px;border-radius:10px;background:#F1EAD8;border:1px solid var(--line);margin-top:12px}.pass{margin-top:16px;border:1px solid var(--gold);border-radius:16px;background:linear-gradient(160deg,#12171A,#1F2A2E);color:#F6F2E8;padding:26px 30px;max-width:560px;position:relative;overflow:hidden}.pass:before{content:'';position:absolute;inset:8px;border:1px solid rgba(184,138,61,.3);border-radius:10px;pointer-events:none}
.pass h3{font:900 20px Kufi;color:#E8D9BD;margin:0 0 2px}.pass .o{font:400 14px Plex;color:#B88A3D;margin-bottom:16px}.pass dl{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;margin:0;align-items:center}.pass dt{font:600 13px Plex;color:#A9B2B4}.pass dd{margin:0;font:600 17px/1.4 ui-monospace,Menlo,monospace;direction:ltr;text-align:right;color:#fff;word-break:break-all}.pass dd.pw{font-size:22px;letter-spacing:1px;color:#E8D9BD}
.pass .n{font:400 13px Plex;color:#A9B2B4;margin-top:16px}.pass button{margin-top:14px;position:relative}
.act{font-size:13px;color:var(--deep);background:#ECE7DA;border-radius:8px;padding:2px 10px;display:inline-block;margin:2px 0}
/* the light dress: paper and white, charcoal ink, gold for what matters */
header{background:#fff;color:var(--deep);border-bottom:1px solid var(--line);box-shadow:0 2px 16px rgba(14,17,20,.05)}.wm{color:var(--deep)}.wm:before{background-image:url(brand/mark.png)}.wm span{color:#8E6626}
header>span[style*="gold2"],header a{color:#8E6626!important}
.pass{background:linear-gradient(160deg,#fff,#FBF6EA);color:var(--ink);box-shadow:0 18px 44px rgba(14,17,20,.1)}.pass h3{color:var(--deep)}.pass .o{color:#8E6626}.pass dt,.pass .n{color:var(--mute)}.pass dd{color:var(--deep)}.pass dd.pw{color:#8E6626}.pass code{color:#8E6626!important}
.pwf{position:relative}.pwf input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 78px 12px 14px;text-align:center;font:600 17px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#0E1114;background:#fff;caret-color:#0E1114;outline:none;letter-spacing:.04em}.pwf input::placeholder{font:400 15px Plex;letter-spacing:0;color:#9AA0A3}.pwf input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,138,61,.2)}
.eye{display:grid;place-items:center;user-select:none;position:absolute;inset:6px 6px 6px auto;border:0;border-radius:8px;background:#F1EAD8;color:#7A5A1E;font:600 13px Plex;padding:0 12px;cursor:pointer}.pwh{min-height:1.5em;font-size:13.5px;color:var(--bad);margin-top:6px;text-align:center}
@media(max-width:900px){main{padding:14px!important}.g{grid-template-columns:1fr!important}table,thead,tbody,tr,td{display:block;width:100%}thead{display:none}tr{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff}td{border:0!important;padding:4px 0!important;white-space:normal!important}.btn.sm{padding:9px 14px;font-size:14px;margin:3px 0}#plog>div,#leads>div{grid-template-columns:1fr!important}header{flex-wrap:wrap;gap:8px;padding:12px 14px!important}}
html,body{overflow-x:clip}
select.more{width:auto;display:inline-block;padding:4px 10px;font-size:13px;border-radius:9px;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}.kpi{background:linear-gradient(160deg,#fff,#FBF6EA);border:1px solid var(--line);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}.kpi:after{content:'';position:absolute;inset:auto -30px -30px auto;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(194,160,99,.18),transparent 70%)}
.kpi small{font:600 13px Plex;color:var(--mute);display:block}.kpi b{display:block;font:600 40px/1.1 Corm,serif;color:var(--deep);margin-top:6px;unicode-bidi:plaintext;text-align:right}.kpi i{font:500 12px Plex;color:#8E6626;font-style:normal}.kpi.live b{color:#1F6B47}.kpi.live small:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#2FB36B;margin-inline-end:6px;box-shadow:0 0 0 0 rgba(47,179,107,.6);animation:lp 1.8s infinite}
@keyframes lp{70%{box-shadow:0 0 0 9px rgba(47,179,107,0)}}
.orgs .oh{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.orgs h2{font:900 24px Kufi;color:var(--deep);margin:0}.orgs #q{max-width:300px}.orgs .ch{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:600 13px Plex;cursor:pointer;color:var(--ink)}.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}.chip small{opacity:.6;margin-inline-start:4px}
.oh2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}.tg{display:flex;gap:6px;align-items:center;font:600 13px Plex;color:var(--mute);cursor:pointer}.tg b{color:#8E6626}
.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}.oc{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px;display:grid;gap:12px;transition:box-shadow .2s,transform .2s;cursor:default}.oc:hover{box-shadow:0 14px 34px rgba(14,17,20,.08);transform:translateY(-1px)}.oc.off{opacity:.55}.oc.test{background:repeating-linear-gradient(135deg,#fff,#fff 10px,#FBF8F1 10px,#FBF8F1 20px)}
.oc .t{display:flex;gap:12px;align-items:center}.oc .av{width:46px;height:46px;border-radius:14px;background:linear-gradient(140deg,var(--deep),#2A3A3F);color:#E4CC97;display:grid;place-items:center;font:900 20px Kufi;flex:none}.oc .t b{font:800 18px Kufi;color:var(--deep);display:block;cursor:pointer}.oc .t code{font-size:12px;color:var(--mute)}
.oc .st{margin-inline-start:auto;font:600 12px Plex;padding:4px 10px;border-radius:999px;white-space:nowrap}.st.run{background:#E6F5EC;color:#1F6B47}.st.run:before{content:'● '}.st.calm{background:#F4F1EA;color:#7A6A4F}.st.off{background:#FBEDEA;color:#A8402F}.st.tst{background:#EEE;color:#666}
.oc .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.oc .nums div{background:#FBF8F1;border-radius:12px;padding:8px 10px}.oc .nums small{font:600 11px Plex;color:var(--mute);display:block}.oc .nums b{font:600 22px Corm,serif;color:var(--deep)}
.oc .bar{height:6px;border-radius:3px;background:#EEE;overflow:hidden}.oc .bar i{display:block;height:100%;background:linear-gradient(90deg,#C2A063,#8E6626)}.oc .sm2{font:500 12px Plex;color:var(--mute);display:flex;justify-content:space-between;gap:8px}.oc .ow{font:500 12px Plex;color:var(--mute);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc .ac{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.oc .lk{font-size:12px;color:#A8402F}
#drawer{position:fixed;inset:0;z-index:50;background:rgba(14,17,20,.35);display:none;justify-content:flex-start}#drawer.on{display:flex}.dw{width:min(620px,100%);height:100%;background:#fff;box-shadow:0 0 60px rgba(0,0,0,.25);overflow:auto;padding:24px;animation:dwi .25s ease}@keyframes dwi{from{transform:translateX(-30px);opacity:0}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}.dh h2{font:900 24px Kufi;color:var(--deep);margin:0}.dsec{margin-top:18px}.dsec h3{font:800 16px Kufi;color:var(--deep);margin:0 0 8px}.drow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.drow small{color:var(--mute)}
@media(max-width:700px){.ocards{grid-template-columns:1fr}.kpi b{font-size:32px}}
</style></head><body>
<header><div class="wm">بصيرة<i></i><span>BASSERH</span></div><span style="font:600 14px Plex;color:var(--gold2)">إدارة المنصة</span></header>
<main><div class="kpis" id="kpis"></div>
  <div class="panel orgs"><div class="oh"><h2>الجهات</h2><input type="text" id="q" placeholder="ابحث باسم الجهة أو عنوانها أو بريدها"><span class="ch" id="fl"></span><select id="so" class="more"><option value="act">آخر نشاط</option><option value="name">الاسم</option><option value="bytes">المساحة</option><option value="new">الأحدث إنشاءً</option></select></div>
  <div class="oh2"><span id="bkL" style="font-size:13px;color:var(--mute)"></span><button class="btn sm" id="bk">نسخة احتياطية الآن</button><span style="flex:1"></span><label class="tg"><input type="checkbox" id="tst"> إظهار جهات الاختبار <b id="tN"></b></label><button class="btn sm" id="purge" style="color:#8E1F26">حذف جهات الاختبار</button></div>
  <div id="rows" class="ocards"></div></div>
  <div id="drawer"><div class="dw"><div class="dh"><div><h2 id="dN"></h2><code id="dS"></code></div><button class="btn sm" id="dX">إغلاق</button></div><div id="dB"></div></div></div><div class="panel"><h2 style="font:900 22px Kufi;color:var(--deep);margin-bottom:6px">جهة جديدة</h2>
  <div class="g"><div><label>اسم الجهة</label><input type="text" id="n"></div><div><label>عنوان الجهة في الرابط (حروف إنجليزية وأرقام)</label><input type="text" id="s" dir="ltr" placeholder="org-name"></div><div><label>بريد المالك</label><input type="email" id="e" dir="ltr"></div><div><label>كلمة مرور المالك (اتركها فارغة لتُولَّد)</label><input type="text" id="pwd" dir="ltr" autocomplete="off" placeholder="تُولَّد أرقاماً تلقائياً"></div><button class="btn gold" id="mk">إنشاء</button></div><div id="out"></div></div>
  <div class="panel"><h2 style="font:900 22px Kufi;color:var(--deep);margin-bottom:4px">طلبات التواصل <span id="lN" style="font:600 14px Plex;color:var(--gold)"></span></h2><div id="lMail" style="font-size:13px;color:var(--mute);margin-bottom:8px"></div><div id="leads"></div></div>
  
  <div class="panel"><h2 style="font:900 22px Kufi;color:var(--deep);margin-bottom:8px">سجل المنصة</h2><div id="plog" style="font-size:14px"></div></div></main><div id="toast"></div>
<script type="module">
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2600); };
import * as PK from './passkey.js';
// the owner signs in with the password or a passkey; the session is a cookie, nothing is kept in the page
// the password field: «show» lets the person see what was typed; Arabic letters mean the keyboard is in Arabic, and the page says so at once
function pwField(id) { const i = document.getElementById(id), h = document.getElementById(id + 'H'), e = document.querySelector(`[data-eye="${id}"]`); if (!i) return;
  e.onclick = () => { const show = i.type === 'password'; i.type = show ? 'text' : 'password'; e.textContent = show ? 'إخفاء' : 'إظهار'; i.focus(); };
  i.addEventListener('input', () => { h.textContent = /[\u0600-\u06FF]/.test(i.value) ? 'لوحة المفاتيح بالعربية. حوّلها إلى الإنجليزية ثم اكتب كلمة المرور.' : ''; });
  i.addEventListener('keyup', ev => { if (ev.getModifierState && ev.getModifierState('CapsLock')) h.textContent = 'زر الأحرف الكبيرة (Caps Lock) مفعّل.'; }); }
const api = async (p, m = 'GET', b) => { const r = await fetch('/api/admin/' + p, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }), j = await r.json().catch(() => ({ error: 'تعذّر الطلب (' + r.status + '). حدّث القائمة قبل إعادة المحاولة.' })); if (r.status === 403 && p !== 'login') { gate(); throw 0; } if (!r.ok) { toast(j.error || 'تعذّر الطلب'); throw 0; } return j; };
const MAIN = $('main'), PAGE = MAIN.innerHTML;
function gate() { MAIN.innerHTML = `<div class="panel" style="max-width:460px;margin:70px auto;text-align:center"><img src="brand/mark.png" style="height:120px"><h2 style="font:900 24px Kufi;color:var(--deep);margin:14px 0 4px">إدارة المنصة</h2>
  <button class="btn gold" id="pkIn" style="width:100%;padding:13px;font-size:17px;margin-top:14px">الدخول بمفتاح المرور</button><div style="color:var(--mute);font-size:13px;margin:14px 0 6px">أو بكلمة المرور</div>
  <div class="pwf"><input type="password" id="pw" placeholder="كلمة مرور المالك" dir="ltr" lang="en" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"><span role="button" tabindex="0" class="eye" data-eye="pw" title="إظهار ما كُتب أو إخفاؤه">إظهار</span></div><div class="pwh" id="pwH"></div><button class="btn pri" id="pwIn" style="width:100%;margin-top:10px;padding:11px">دخول</button></div>`;
  if (!PK.supported()) $('#pkIn').style.display = 'none';
  $('#pkIn').onclick = async () => { try { await PK.login(); location.reload(); } catch (x) { toast(x.name === 'NotAllowedError' ? 'أُلغيت العملية' : x.message); } };
  pwField('pw'); const go = async () => { const v = $('#pw').value; if (!v) return $('#pw').focus(); $('#pwIn').disabled = true; const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: v }) }).catch(() => null); $('#pwIn').disabled = false; if (r && r.ok) return location.reload();
    $('#pwH').textContent = !r ? 'لا اتصال بالخادم. حاول مرة أخرى.' : r.status === 429 ? 'محاولات كثيرة من هذا العنوان. انتظر ربع ساعة، أو ادخل بمفتاح المرور.' : 'كلمة المرور غير صحيحة. اضغط «إظهار» لترى ما كتبت، وتأكد أن لوحة المفاتيح بالإنجليزية.'; $('#pw').select(); }; $('#pwIn').onclick = go; $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } }); }   // a handler that returned false for every other key used to cancel the typing itself
// the page's own dialog in place of the browser's boxes: a title, a sentence, fields; resolves to the fields' values, or null when cancelled
function dlg({ title, text = '', fields = [], ok = 'موافق', danger = false, must = null }) { return new Promise(res => { document.querySelector('#dlg')?.remove(); const d = document.createElement('div'); d.id = 'dlg';
  d.innerHTML = `<div class="dl" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${fields.map(f => `<label>${esc(f.label)}</label>${f.options ? `<select data-f="${f.id}">${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>` : `<input type="text" data-f="${f.id}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" ${f.ltr ? 'dir="ltr"' : ''} autocomplete="off">`}`).join('')}<div class="pwh" id="dlgE"></div><div class="da"><button class="btn ${danger ? 'red' : 'gold'}" id="dlgOk">${esc(ok)}</button><button class="btn" id="dlgNo">إلغاء</button></div></div>`;
  document.body.appendChild(d); const done = v => { removeEventListener('keydown', key, true); d.remove(); res(v); };
  const yes = () => { const v = Object.fromEntries([...d.querySelectorAll('[data-f]')].map(i => [i.dataset.f, i.value.trim()])), bad = must && must(v); if (bad) { d.querySelector('#dlgE').textContent = bad; return; } done(v); };
  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(null); } if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); yes(); } }; addEventListener('keydown', key, true);
  d.querySelector('#dlgOk').onclick = yes; d.querySelector('#dlgNo').onclick = () => done(null); d.onpointerdown = e => { if (e.target === d) done(null); }; (d.querySelector('[data-f]') || d.querySelector('#dlgOk')).focus(); }); }
const typed = slug => v => v.c === slug ? '' : 'اكتب العنوان كما هو: ' + slug;
// ----- the organisations: the platform's figures at a glance, then a card each (what runs now, what it holds, when it last moved)
const F = { f: 'all', showTests: false }; let ORGS_ = [];
const ago = t => { if (!t) return 'لم تبدأ بعد'; const m = Math.round((Date.now() - Date.parse(t)) / 60000); return m < 2 ? 'الآن' : m < 60 ? `منذ ${m} دقيقة` : m < 1440 ? `منذ ${Math.round(m / 60)} ساعة` : `منذ ${Math.round(m / 1440)} يوماً`; };
const gb = b => (b / 1073741824 >= 1 ? (b / 1073741824).toFixed(1) + ' غيغا' : Math.round(b / 1048576) + ' ميغا');
async function list() { const { orgs } = await api('orgs'); ORGS_ = orgs; draw(); }
function draw() { const orgs = ORGS_, real = orgs.filter(o => !o.test), tests = orgs.length - real.length, on = real.filter(o => o.plan !== 'off');
  $('#kpis').innerHTML = [['الجهات العاملة', on.length, real.length - on.length ? `${real.length - on.length} مطفأة` : ''], ['القاعات العاملة الآن', real.reduce((a, o) => a + (o.halls || 0), 0), '', 'live'], ['الشاشات المتصلة الآن', real.reduce((a, o) => a + (o.screens || 0), 0), '', 'live'],
    ['زوار آخر ٢٤ ساعة', real.reduce((a, o) => a + (o.visitors || 0), 0), 'في المحطات'], ['اللقاءات والمعارض', real.reduce((a, o) => a + (o.events || 0), 0), ''], ['المساحة المستعملة', gb(real.reduce((a, o) => a + (o.bytes || 0), 0)), `من ${on.length * 20} غيغا`]]
    .map(([k, v, n, c]) => `<div class="kpi ${c || ''}"><small>${k}</small><b>${typeof v === 'number' ? v.toLocaleString('en') : v}</b><i>${n}</i></div>`).join('');
  $('#tN').textContent = tests ? `(${tests})` : ''; $('#purge').style.display = tests ? '' : 'none';
  const pool = orgs.filter(o => F.showTests || !o.test), cnt = k => pool.filter(FIL[k]).length;
  $('#fl').innerHTML = Object.entries({ all: 'الكل', run: 'تعمل الآن', calm: 'هادئة', off: 'مطفأة' }).map(([k, t]) => `<button class="chip${F.f === k ? ' on' : ''}" data-f="${k}">${t}<small>${cnt(k)}</small></button>`).join('');
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { F.f = b.dataset.f; draw(); });
  const q = $('#q').value.trim().toLowerCase(), so = $('#so').value, list = pool.filter(FIL[F.f]).filter(o => !q || `${o.name} ${o.slug} ${o.owners}`.toLowerCase().includes(q))
    .sort((a, b) => so === 'name' ? a.name.localeCompare(b.name, 'ar') : so === 'bytes' ? b.bytes - a.bytes : so === 'new' ? (b.created_at > a.created_at ? 1 : -1) : String(b.lastAt || '') > String(a.lastAt || '') ? 1 : -1);
  $('#rows').innerHTML = list.map(o => { const st = o.test ? ['tst', 'اختبار'] : o.plan === 'off' ? ['off', 'مطفأة'] : o.halls ? ['run', 'تعمل الآن'] : ['calm', 'هادئة'], p = Math.min(100, (o.bytes / (o.storage_limit_mb * 1048576)) * 100);
    return `<div class="oc${o.plan === 'off' ? ' off' : ''}${o.test ? ' test' : ''}" data-id="${o.id}"><div class="t"><span class="av">${esc((o.name || '؟').trim()[0])}</span><div style="min-width:0"><b data-open>${esc(o.name)}</b><code>/${o.slug}</code></div><span class="st ${st[0]}">${st[1]}</span></div>
      <div class="nums"><div><small>اللقاءات</small><b>${o.events}</b></div><div><small>الشاشات الآن</small><b>${o.screens || 0}</b></div><div><small>زوار ٢٤ ساعة</small><b>${o.visitors || 0}</b></div></div>
      <div><div class="sm2"><span>المساحة ${gb(o.bytes)} من ${Math.round(o.storage_limit_mb / 1024)} غيغا</span><span>آخر نشاط ${ago(o.lastAt)}</span></div><div class="bar"><i style="width:${p.toFixed(1)}%"></i></div></div>
      <div class="ow">${esc(o.owners || '')}</div>${o.door && o.door.locked ? `<div class="lk">الدخول مقفل حتى ${new Date(o.door.until).toLocaleTimeString('ar', { hour: 'numeric', minute: '2-digit' })} <button class="btn sm" data-a="unlock">فتح القفل</button></div>` : ''}

$('#dX').onclick = () => $('#drawer').classList.remove('on'); $('#drawer').onclick = e => { if (e.target.id === 'drawer') $('#drawer').classList.remove('on'); };
async function act(a, tr) { const id = tr.dataset.id, o = orgs.find(x => x.id === id);
    if (a === 'export') { location.href = '/api/admin/export?org=' + id; return; }

      const r = await api('restore', 'POST', { org: id, day: v.day, confirm: v.c }); toast(`استُرجعت: ${r.events} لقاء، و${r.files} ملفاً عاد من المحذوفات`); list(); plog(); }
    if (a === 'st') { const on = String(o.features || '').split(/[\s,]+/).includes('stations'); if (on && !(await dlg({ title: 'إيقاف المحطات التفاعلية', text: 'لقاءات المحطات القائمة عند ' + o.name + ' تبقى كما هي، ولا تنشئ الجهة لقاء محطات جديداً.', ok: 'إيقاف', danger: true }))) return; await api('org', 'PATCH', { id, features: on ? [] : ['stations'] }); toast(on ? 'أُوقفت المحطات التفاعلية للجهة' : 'فُعّلت المحطات التفاعلية للجهة'); list(); }
    if (a === 'del') { const v = await dlg({ title: 'حذف ' + o.name + ' نهائياً', text: 'يزيل لقاءاتها وملفاتها وأعضاءها، ولا يمكن التراجع إلا من نسخة احتياطية. صدّر بياناتها أولاً.', fields: [{ id: 'c', label: 'للتأكيد اكتب عنوانها: ' + o.slug, ltr: true }], ok: 'حذف نهائي', danger: true, must: typed(o.slug) }); if (!v) return; const r = await api('org', 'DELETE', { id, confirm: v.c }); toast('حُذفت الجهة و' + r.files + ' ملفاً'); list(); }
    if (a === 'unlock') { await api('unlock', 'POST', { slug: o.slug }); toast('فُتح باب الجهة'); list(); plog(); }
    if (a === 'pw') { const v = await dlg({ title: 'كلمة مرور جديدة', text: 'تتوقف كلمة المرور القديمة وتُنهى جلسات الدخول السابقة لهذا العضو.', fields: [{ id: 'e', label: 'بريد العضو', value: (o.owners || '').split(',')[0], ltr: true }, { id: 'pw', label: 'كلمة المرور الجديدة (اتركها فارغة لتُولَّد أرقاماً)', ltr: true }], ok: 'تجديد', must: v => !/@/.test(v.e) ? 'اكتب بريد العضو' : v.pw && v.pw.length < 8 ? 'ثمانية أحرف على الأقل' : '' }); if (!v) return; const r = await api('password', 'POST', { org: id, email: v.e, password: v.pw }); pass(o.name, o.slug, r.email, r.password, 'جُدّدت كلمة المرور، وأُنهيت جلسات الدخول السابقة.'); }

// the access card handed to an organisation: its address, the owner's email and the password, with one button that copies it as a message
function pass(name, slug, email, password, note, join) { const url = `${location.origin}/${slug}`, text = `بصيرة · استوديو اللقاءات\n${name}\n\nرابط الدخول: ${url}\nكلمة المرور: ${password}\n\nافتحوا الرابط وأدخلوا كلمة المرور. ننصح بتغييرها بعد أول دخول.`;
  $('#out').innerHTML = `<div class="pass" id="pass"><h3>بطاقة الدخول</h3><div class="o">${esc(name)}</div><dl><dt>رابط الدخول</dt><dd id="pUrl">${esc(url)}</dd><dt>كلمة المرور</dt><dd class="pw" id="pPw">${esc(password)}</dd></dl><div class="n">${note} تظهر كلمة المرور هذه المرة فقط، ولا تُحفظ إلا مشفّرة.</div><button class="btn gold" id="pCopy">نسخ البطاقة لإرسالها</button>${join ? `<div class="n" style="margin-top:14px">بديل بلا كلمة مرور، رابط دخول يُستعمل مرة واحدة:<br><code id="join" style="color:#E8D9BD">${esc(location.origin + join)}</code></div>` : ''}</div>`;
  $('#pCopy').onclick = async () => { try { await navigator.clipboard.writeText(text); toast('نُسخت البطاقة'); } catch { const v = await dlg({ title: 'انسخ البطاقة', fields: [{ id: 't', label: 'حدّدها وانسخها', value: text.replace(/\n+/g, ' · ') }], ok: 'تم' }); } }; scrollTo(0, 0); }
$('#mk').onclick = async () => { if ($('#mk').disabled) return; $('#mk').disabled = true; $('#mk').textContent = 'جارٍ الإنشاء…'; const name = $('#n').value, r = await api('org', 'POST', { name, slug: $('#s').value, email: $('#e').value, password: $('#pwd').value }).finally(() => { $('#mk').disabled = false; $('#mk').textContent = 'إنشاء'; });

async function leads() { const { leads, mail } = await api('leads'), open = leads.filter(l => !l.handled_at).length; $('#lN').textContent = open ? `· ${open} جديد` : ''; $('#lMail').textContent = mail ? 'تصل نسخة من كل طلب إلى بريد المالك.' : 'الطلبات تُحفظ هنا فقط: خدمة البريد لم تُضبط بعد.';

  document.querySelectorAll('[data-l]').forEach(b => b.onclick = async () => { await api('leads', 'PATCH', { id: +b.dataset.l, handled: b.dataset.h === '1' }); leads(); }); }
const bk = async () => { const b = await api('backup'); $('#bkL').textContent = b.last ? `آخر نسخة احتياطية ${b.last} · محفوظ ${b.days.length} يوماً` : 'لا نسخ احتياطية بعد'; };
const PA = { restored: 'استرجاع من نسخة', passkey_removed: 'حذف مفتاح مرور', org_created: 'إنشاء جهة', org_changed: 'تعديل جهة', org_deleted: 'حذف جهة', password_renewed: 'تجديد كلمة مرور', door_unlocked: 'فتح قفل الدخول', backup: 'نسخة احتياطية', owner_login: 'دخول المالك' };

if (!meA) gate(); else { plog(); list(); leads(); bk(); $('#bk').onclick = async () => { const r = await api('backup', 'POST'); toast('حُفظت نسخة ' + r.orgs + ' جهة'); bk(); }; const h = document.querySelector('header'); h.insertAdjacentHTML('beforeend', `<span style="flex:1"></span><a href="#" id="pkAdd" style="color:var(--gold2);font:600 14px Plex;text-decoration:none">${meA.passkeys ? 'مفاتيح المرور (' + meA.passkeys + ')' : 'إضافة مفتاح مرور لهذا الجهاز'}</a><a href="/api/logout" style="color:var(--gold2);font:600 14px Plex;text-decoration:none">خروج</a>`);

  if (!PK.supported()) $('#pkNew').style.display = 'none'; $('#pkNew').onclick = async () => { try { await PK.register(); toast('أُضيف مفتاح المرور.'); keys(); } catch (x) { toast(x.name === 'NotAllowedError' ? 'أُلغيت العملية' : x.message); } }; scrollTo(0, 0); }
