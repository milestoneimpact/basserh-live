<!doctype html>
<!-- The promo film of the studio (38 s, 1920x1080, silent: it plays muted on the public page). Everything is drawn by render(t), t in seconds;
     promo/build.mjs screenshots it frame by frame and encodes web/promo.mp4. No name or logo of any real organisation: «شعاركم».
     Scenes: 0 opening · 5 one press moves every screen · 13 any number of screens · 19 slides and video · 25 the launch · 33 end card. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Kufi;src:url(../web/fonts/cairo-arabic-700-normal.woff2);font-weight:400 700}
@font-face{font-family:Kufi;src:url(../web/fonts/cairo-arabic-900-normal.woff2);font-weight:900}
@font-face{font-family:Plex;src:url(../web/fonts/cairo-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex;src:url(../web/fonts/cairo-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Cinzel;src:url(../web/fonts/cinzel-latin-400-normal.woff2)}
html,body{margin:0;background:#0E1114}
#st{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(90% 90% at 50% 38%,#2C3A3F 0%,#1F2A2E 40%,#0E1114 100%);font-family:Kufi;color:#F6F2E8}
#st>*{position:absolute}#hall{inset:0}
.cap{left:0;right:0;bottom:64px;text-align:center;font:900 62px/1.3 Kufi}.cap small{display:block;font:400 30px Plex;color:#D9B878;margin-top:8px}
.scr{border-radius:14px;background:#0A0D0F;padding:7px;box-shadow:0 30px 70px rgba(0,0,0,.55)}.scr .in{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#F6F2E8}
.ly{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#0E1114}
.lg{border-radius:50%;border:2px dashed #B9A98A;display:grid;place-items:center;color:#8A7B60;font:400 1em Plex;width:26%;aspect-ratio:1}
.nm{font:900 2.6em Kufi;color:#1F2A2E}.ho{font:400 1em Plex;color:#B88A3D}
.bar{height:.5em;border-radius:1em;background:#DDD5C3;margin:.45em auto}
#con{left:680px;top:704px;width:560px;height:118px;border-radius:18px;background:#171D21;border:1px solid rgba(217,184,120,.3);box-shadow:0 30px 60px rgba(0,0,0,.5)}
#next{position:absolute;right:16px;left:16px;top:40px;height:64px;border-radius:12px;background:linear-gradient(180deg,#CFA255,#B88A3D);display:grid;place-items:center;font:900 32px Kufi;color:#0E1114}
#con small{position:absolute;right:20px;top:7px;font:600 17px Plex;color:#D9B878}
#cur{width:34px;height:34px;border-radius:50%;background:rgba(246,242,232,.9);box-shadow:0 0 0 6px rgba(246,242,232,.25)}
#mark{left:810px;top:230px;width:300px}#wm{left:0;right:0;top:590px;text-align:center;font:900 96px Kufi}#wm span{font:400 62px Cinzel;letter-spacing:.24em}#wm i{display:inline-block;width:2px;height:80px;background:#B88A3D;margin:0 30px;vertical-align:middle}
#tag{left:0;right:0;top:740px;text-align:center;font:400 40px Plex;color:#D9B878}#url{left:0;right:0;top:830px;text-align:center;font:400 34px Cinzel;letter-spacing:.2em;color:#F6F2E8;direction:ltr}
#h1{left:0;right:0;top:400px;text-align:center;font:900 120px/1.25 Kufi}#h1 em{font-style:normal;color:#D9B878}
#ring{left:235px;top:530px;width:140px;height:140px;border-radius:50%}#flash{inset:0;background:#F6F2E8}
</style></head><body><div id="st">
  <img id="mark" src="../web/brand/mark_light.png"><div id="h1"></div>
  <div id="hall"></div>
  <div id="con"><small>لوحة المشغّل</small><div id="next">التالي</div></div><div id="cur"></div>
  <div id="ring"></div><div id="flash"></div>
  <div class="cap" id="cap"></div>
  <div id="wm">بصيرة<i></i><span>BASSERH</span></div><div id="tag">استوديو اللقاءات</div><div id="url">LIVE.BASSERH.COM</div>
</div>
<script>
const $ = s => document.querySelector(s), cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), P = (t, a, b) => cl((t - a) / (b - a)), eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, mix = (a, b, k) => a + (b - a) * k;
// the screens of the hall: [id, x, y, w, h, font px]; the first five are there from the start, the rest join in scene 3
const SC = [['main', 510, 150, 900, 520, 26], ['sl', 110, 250, 340, 205, 11], ['sr', 1470, 250, 340, 205, 11], ['vt', 1560, 500, 160, 280, 8], ['tb', 190, 520, 230, 160, 8],
  ['x1', 110, 60, 250, 150, 8], ['x2', 400, 12, 216, 126, 7], ['x3', 1304, 12, 216, 126, 7], ['x4', 1560, 60, 250, 150, 8], ['x5', 420, 700, 200, 120, 7], ['x6', 1300, 700, 200, 120, 7]];
const LAYERS = { rec: '<div><div class="lg" style="margin:0 auto 6%">شعاركم</div><div class="ho">مرحباً بكم</div></div>',
  card: '<div style="width:100%"><div class="ho">الصفة</div><div class="nm">اسم المتحدث</div><div style="width:18%;height:2px;background:#B88A3D;margin:4% auto 0"></div></div>',
  s1: '<div style="width:80%;text-align:right"><div class="ho">عرضكم التقديمي</div><div class="nm" style="font-size:2.2em">عنوان الشريحة</div><div class="bar" style="width:60%;margin-right:0"></div><div class="bar" style="width:46%;margin-right:0"></div><div class="bar" style="width:52%;margin-right:0"></div></div>',
  s2: '<div style="width:80%;display:flex;gap:6%;align-items:flex-end;height:60%"><i style="flex:1;height:40%;background:#DDD5C3;border-radius:.4em"></i><i style="flex:1;height:62%;background:#B88A3D;border-radius:.4em"></i><i style="flex:1;height:85%;background:#1F2A2E;border-radius:.4em"></i><i style="flex:1;height:55%;background:#DDD5C3;border-radius:.4em"></i></div>',
  vid: '<div style="position:absolute;inset:0;background:linear-gradient(135deg,#2C3A3F,#0E1114)"></div><div style="position:relative;width:16%;aspect-ratio:1;border-radius:50%;background:rgba(246,242,232,.92);display:grid;place-items:center"><i style="border-style:solid;border-width:.9em 0 .9em 1.5em;border-color:transparent transparent transparent #0E1114;margin-left:.3em"></i></div><div style="position:absolute;left:6%;right:6%;bottom:8%;height:.4em;border-radius:1em;background:rgba(246,242,232,.25)"><b class="pg" style="position:absolute;left:0;top:0;bottom:0;border-radius:1em;background:#B88A3D;width:0"></b></div>',
  arm: '<div style="position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,#3A2E1C,#120E09 60%,#070605)"></div><div class="pulse" style="position:relative;width:22%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(217,184,120,.6);box-shadow:0 0 60px rgba(217,184,120,.5)"></div>',
  neu: '<div style="position:absolute;inset:0;background:#FBF4EC"></div><div style="position:relative"><div class="lg" style="width:auto;height:5.2em;aspect-ratio:1;margin:0 auto 6%;border:.25em solid #7A2E3A;color:#7A2E3A;font:900 .95em Kufi;line-height:1.4">شعاركم<br>الجديد</div><div style="width:9em;height:.6em;border-radius:1em;background:#7A2E3A;margin:0 auto"></div></div>' };
const hall = $('#hall'); hall.innerHTML = SC.map(([id, , , , , f]) => `<div class="scr" id="${id}" style="position:absolute;font-size:${f}px"><div class="in">${Object.entries(LAYERS).map(([k, h]) => `<div class="ly" data-k="${k}">${h}</div>`).join('')}</div></div>`).join('');
// what every screen shows over time: [from, layer]; the change takes .7 s on all screens at once
const TL = [[0, 'rec'], [9.2, 'card'], [19.6, 's1'], [21.2, 's2'], [22.6, 'vid'], [26, 'arm'], [30.6, 'neu']];
const CAPS = [[5.4, 12.6, 'ضغطة واحدة، وكل الشاشات تتحرك معاً', 'المشغّل يضغط «التالي» فتنتقل القاعة كلها'], [13.2, 18.6, 'ثلاث شاشات، أو ست، أو عشرون', 'لكل شاشة رابطها، تُضاف وتُلغى بضغطة'], [19.4, 24.6, 'عروضكم ومقاطعكم كما أعددتموها', 'الشرائح بمقلّب المتحدث، والفيديو محفوظ على جهاز القاعة'], [25.4, 32.6, 'لحظة التدشين بهوية جهتكم', 'يضغط ضيف الشرف، فتتغير القاعة كلها']];
window.render = t => {
  // 0-5 opening; 33-38 end card
  const open = 1 - P(t, 4.2, 5), end = P(t, 33, 34);
  $('#mark').style.opacity = eo(P(t, .3, 1.4)) * open * .0 + end; $('#mark').style.transform = `scale(${mix(.9, 1, eo(P(t, 33, 35)))})`;
  $('#h1').innerHTML = t < 2.4 ? 'لقاؤكم القادم' : 'يُدار من <em>شاشة واحدة</em>'; $('#h1').style.opacity = (t < 2.4 ? eo(P(t, .4, 1.2)) * (1 - P(t, 2, 2.4)) : eo(P(t, 2.4, 3.1))) * open; $('#h1').style.transform = `translateY(${mix(24, 0, eo(t < 2.4 ? P(t, .4, 1.4) : P(t, 2.4, 3.4)))}px)`;
  for (const id of ['#wm', '#tag', '#url']) $(id).style.opacity = 0; $('#wm').style.opacity = eo(P(t, 33.6, 34.6)); $('#tag').style.opacity = eo(P(t, 34.2, 35.2)); $('#url').style.opacity = eo(P(t, 34.8, 35.8));
  // the hall
  const hin = eo(P(t, 5, 6.2)) * (1 - P(t, 32.6, 33.2)); hall.style.opacity = hin;
  SC.forEach(([id, x, y, w, h], i) => { const e = document.getElementById(id), extra = i >= 5, k = extra ? eo(P(t, 13.4 + (i - 5) * .35, 14.2 + (i - 5) * .35)) : eo(P(t, 5 + i * .15, 6 + i * .15));
    e.style.cssText += `;left:${x}px;top:${y + (1 - k) * 40}px;width:${w}px;height:${h}px;opacity:${k}`;
    let cur = TL[0][1], prev = cur, kk = 1; for (let j = 0; j < TL.length; j++) if (t >= TL[j][0]) { prev = j ? TL[j - 1][1] : TL[0][1]; cur = TL[j][1]; kk = eio(P(t, TL[j][0], TL[j][0] + .7)); }
    e.querySelectorAll('.ly').forEach(l => { const a = l.dataset.k === cur ? kk : l.dataset.k === prev && kk < 1 ? 1 : 0; l.style.opacity = a; l.style.zIndex = l.dataset.k === cur ? 2 : 1; });
    const pg = e.querySelector('.pg'); pg.style.width = cl((t - 22.6) / 3.4) * 78 + '%'; const pu = e.querySelector('.pulse'); pu.style.transform = `scale(${1 + .1 * Math.sin(t * 2.4)})`; });
  // the operator's console and the press at 9 s
  const con = $('#con'), cv = eo(P(t, 6.4, 7.2)) * (1 - P(t, 12.4, 13)); con.style.opacity = cv; con.style.transform = `translateY(${(1 - cv) * 30}px)`;
  const press = P(t, 8.9, 9.05) * (1 - P(t, 9.2, 9.5)); $('#next').style.transform = `scale(${1 - .05 * press})`; $('#next').style.filter = `brightness(${1 + .25 * press})`;
  const cur = $('#cur'), cx = mix(1500, 960, eio(P(t, 7.4, 8.8))), cy = mix(1000, 760, eio(P(t, 7.4, 8.8))); cur.style.left = cx + 'px'; cur.style.top = cy + 'px'; cur.style.opacity = P(t, 7.2, 7.6) * (1 - P(t, 9.6, 10.2)); cur.style.transform = `scale(${1 - .25 * press})`;
  // the launch: the guest's press on the tablet (28.4 to 30.4), the flash, the new identity everywhere
  const hold = P(t, 28.4, 30.4), ring = $('#ring'), rv = P(t, 27.6, 28.4) * (1 - P(t, 30.4, 30.9)); ring.style.opacity = rv; ring.style.background = `conic-gradient(#D9B878 ${hold * 360}deg, rgba(217,184,120,.16) 0)`; ring.style.webkitMask = ring.style.mask = 'radial-gradient(circle,transparent 62%,#000 63%)'; ring.style.transform = `scale(${1 + .06 * hold})`;
  if (t > 27.4 && t < 30.6) { cur.style.left = '288px'; cur.style.top = '583px'; cur.style.opacity = P(t, 27.6, 28) ; cur.style.transform = `scale(${1 - .2 * P(t, 28.3, 28.5)})`; }
  $('#flash').style.opacity = P(t, 30.4, 30.6) * (1 - P(t, 30.6, 31.4)) * .9;
  // captions
  const c = CAPS.find(c => t >= c[0] && t < c[1]), cap = $('#cap'); if (c) { cap.innerHTML = `${c[2]}<small>${c[3]}</small>`; cap.style.opacity = eo(P(t, c[0], c[0] + .7)) * (1 - P(t, c[1] - .5, c[1])); cap.style.transform = `translateY(${mix(18, 0, eo(P(t, c[0], c[0] + .9)))}px)`; } else cap.style.opacity = 0;
  $('#st').style.filter = `brightness(${1 - .0 * end})`;
};
window.LENGTH = 38; window.ready = document.fonts.ready.then(() => render(+new URLSearchParams(location.search).get('t') || 0));
</script></body></html>
